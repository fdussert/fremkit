<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pomodoro</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:#e6e8eb;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .wrap{box-sizing:border-box;height:100%;padding:12px 14px 16px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .muted{color:#8b93a0}
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .muted{color:var(--on-surface,#0b0d10);opacity:.7}

  .phase{font-size:13px;text-transform:uppercase;letter-spacing:.1em;flex:0 0 auto}
  /* The ring and the time share one box, sized in script so it takes part in the column layout
     rather than floating over the label and the dots. The SVG is the backdrop, the time sits on it. */
  .dial{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
  /* 7 user-space units of a 100-wide viewBox, so the stroke scales with the ring. */
  .dial .track{fill:none;stroke:rgba(128,128,128,.3);stroke-width:7}
  .dial .run{fill:none;stroke:var(--accent,#d9b36a);stroke-width:7;stroke-linecap:round}
  html.accent-fill .dial .run{stroke:var(--on-surface,#0b0d10)}
  .time{position:relative;font-variant-numeric:tabular-nums;font-weight:600;line-height:1;letter-spacing:-.02em;
    font-size:clamp(28px, var(--time, 48px), 92px)}

  /* Below the ring's minimum height the dial collapses to a bar, which reads at any size. */
  .bar{display:none;width:100%;height:8px;border-radius:4px;background:rgba(128,128,128,.3);overflow:hidden;flex:0 0 auto}
  .bar>i{display:block;height:100%;width:0;background:var(--accent,#d9b36a);transition:width .3s linear}
  html.accent-fill .bar>i{background:var(--on-surface,#0b0d10)}
  /* Flat: no room for the ring, and none for the dots either — the bar carries the progress. The
     phase label steps out of the column and into the corner, which is the last row the time needs. */
  html.flat .wrap{padding:6px 12px;gap:5px}
  html.flat .phase{position:absolute;top:5px;left:12px;font-size:11px}
  html.flat .dial svg{display:none}
  html.flat .bar{display:block}
  html.flat .dots{display:none}

  .dots{display:flex;gap:7px;flex:0 0 auto;height:8px;align-items:center}
  .dots i{width:8px;height:8px;border-radius:50%;background:rgba(128,128,128,.35)}
  .dots i.on{background:var(--accent,#d9b36a)}
  html.accent-fill .dots i.on{background:var(--on-surface,#0b0d10)}

  /* Touch targets scale with the tile (--btn, set in script): 40 px is the floor a finger needs. */
  .btns{display:flex;gap:8px;width:100%;flex:0 0 auto}
  button{flex:1 1 0;min-height:var(--btn,48px);font:inherit;font-size:calc(var(--btn,48px) * .32);font-weight:600;border:0;border-radius:12px;
    background:rgba(128,128,128,.18);color:inherit;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button.primary{background:var(--accent,#d9b36a);color:var(--on-accent,#0b0d10)}
  html.accent-fill button.primary{background:var(--on-surface,#0b0d10);color:var(--accent,#d9b36a)}
  button:active{opacity:.7}

  /* Compact: a glyph and the remaining time, read only — the bar is too small to aim at. */
  html.compact,html.compact body{overflow:hidden}
  html.compact .wrap{display:none}
  .cwrap{display:none}
  html.compact .cwrap{display:flex;box-sizing:border-box;height:100%;width:100%;align-items:center;
    gap:calc(var(--h,80px) * .10);padding:0 calc(var(--h,80px) * .10)}
  html.compact .cglyph{flex:0 0 auto;display:flex;color:var(--accent,#d9b36a)}
  html.compact.accent-fill .cglyph{color:var(--on-surface,#0b0d10)}
  html.compact .cline{min-width:0;font-variant-numeric:tabular-nums;
    font-size:clamp(13px, calc(var(--h,80px) * .32), 28px);font-weight:600;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.compact .cidle{font-weight:400;color:#8b93a0}
  html.compact.slot-right .cwrap{justify-content:flex-end;text-align:right}
</style></head><body>
<div class="wrap">
  <div class="phase muted" id="phase"></div>
  <div class="dial" id="dial"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"><circle class="track" cx="50" cy="50" r="44"/><circle class="run" id="run" cx="50" cy="50" r="44"/></svg><span class="time" id="time">25:00</span></div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="dots" id="dots"></div>
  <div class="btns"><button class="primary" id="toggle"></button><button id="skip"></button><button id="reset"></button></div>
</div>
<div class="cwrap"><span class="cglyph" id="cglyph"></span><span class="cline" id="ctime">25:00</span></div>
<script src="phases.js"></script>
<script>
  var L = {
    work: { fr: 'Travail', en: 'Work' },
    short: { fr: 'Pause courte', en: 'Short break' },
    long: { fr: 'Pause longue', en: 'Long break' },
    start: { fr: 'Démarrer', en: 'Start' },
    pause: { fr: 'Pause', en: 'Pause' },
    skip: { fr: 'Passer', en: 'Skip' },
    reset: { fr: 'Remettre', en: 'Reset' }
  }
  /** A 24x24 glyph per phase, drawn in the bar: a timer while working, a cup while resting. */
  var GLYPHS = {
    work: '<path d="M10 2h4"/><path d="m15 11-3 3"/><circle cx="12" cy="14" r="8"/>',
    rest: '<path d="M17 9h1a4 4 0 1 1 0 8h-1"/><path d="M3 9h14v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v3"/><path d="M10 2v3"/><path d="M14 2v3"/>'
  }
  /** Below this tile height the ring has no room and the progress falls back to a flat bar. */
  var RING_MIN_PX = 190
  /** The ring's circumference, from r=44 in the SVG's 100x100 user space. */
  var CIRCUMFERENCE = 2 * Math.PI * 44
  /** Ticking on a fraction of a second keeps the displayed minute honest without burning a frame. */
  var TICK_MS = 200

  Fremkit.whenReady(function () {
    var P = globalThis.FremkitPomodoro
    var s = Fremkit.settings
    var el = function (id) { return document.getElementById(id) }
    /**
     * `index` is the phase step, `remaining` the milliseconds left in it and `deadline` the
     * `Date.now()` the phase ends at while running. Everything is read back from `Date.now()` on
     * each tick, so a throttled iframe drifts by nothing: a missed tick simply shows less time.
     */
    var state = { index: 0, remaining: 0, deadline: 0, running: false }
    var audio = null
    /**
     * The widget runs in an iframe sandboxed to `allow-scripts` alone, an opaque origin where
     * `localStorage` throws on access in every browser. The calls are kept, guarded, so the timer
     * survives a reload wherever storage is reachable, and the widget falls back to memory only —
     * which is what the dashboard actually does — wherever it is not.
     */
    var STORE_KEY = 'fremkit.pomodoro.' + Fremkit.instanceId

    function cycles() {
      var n = Number(s.cycles)
      return Number.isFinite(n) && n >= 1 ? Math.min(Math.round(n), 12) : 4
    }
    function phase() { return P.phaseAt(state.index, cycles()) }
    function duration() { return P.durationMs(phase(), s) }
    function remaining() { return state.running ? Math.max(0, state.deadline - Date.now()) : state.remaining }

    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ index: state.index, remaining: remaining(), deadline: state.deadline, running: state.running })) }
      catch (e) { /* opaque origin: the timer lives in memory for this mount only */ }
    }
    function restore() {
      try {
        var raw = localStorage.getItem(STORE_KEY)
        if (!raw) return false
        var j = JSON.parse(raw)
        if (!j || typeof j.index !== 'number') return false
        state.index = j.index
        state.running = j.running === true
        state.deadline = Number(j.deadline) || 0
        state.remaining = Number(j.remaining) || 0
        // A timer left running while the dashboard was closed has burnt through its phase already.
        if (state.running && state.deadline <= Date.now()) { state.running = false; state.remaining = 0 }
        return true
      } catch (e) { return false }
    }

    /**
     * A short WebAudio blip. The context is created on the first button press so the browser's
     * autoplay policy sees a user gesture; without one it stays suspended and the beep is simply
     * skipped, which is why nothing here throws on failure.
     */
    function unlockAudio() {
      if (audio) { if (audio.state === 'suspended') audio.resume(); return }
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext
        if (Ctx) audio = new Ctx()
      } catch (e) { audio = null }
    }
    function beep() {
      if (s.sound === false || !audio || audio.state !== 'running') return
      try {
        var osc = audio.createOscillator()
        var gain = audio.createGain()
        osc.type = 'sine'
        osc.frequency.value = phase() === 'work' ? 660 : 880
        gain.gain.setValueAtTime(0.0001, audio.currentTime)
        gain.gain.exponentialRampToValueAtTime(0.2, audio.currentTime + 0.02)
        gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.35)
        osc.connect(gain).connect(audio.destination)
        osc.start()
        osc.stop(audio.currentTime + 0.36)
      } catch (e) { /* the sandbox refused the context: no sound, no error */ }
    }

    function goTo(index, run) {
      state.index = Math.max(0, index)
      state.remaining = duration()
      state.running = run === true
      state.deadline = state.running ? Date.now() + state.remaining : 0
      save()
    }
    function advance() {
      beep()
      goTo(state.index + 1, s.autoStart === true)
    }
    function toggle() {
      unlockAudio()
      if (state.running) {
        state.remaining = remaining()
        state.running = false
        state.deadline = 0
      } else {
        if (state.remaining <= 0) state.remaining = duration()
        state.running = true
        state.deadline = Date.now() + state.remaining
      }
      save()
      render()
    }
    function skip() { unlockAudio(); goTo(state.index + 1, state.running); render() }
    function reset() { unlockAudio(); goTo(0, false); render() }

    function renderDots() {
      var c = cycles()
      var done = P.completedInSet(state.index, c)
      var out = ''
      for (var i = 0; i < c; i++) out += '<i class="' + (i < done ? 'on' : '') + '"></i>'
      el('dots').innerHTML = out
    }

    /**
     * The ring is a circle whose dash gap grows as the phase runs down. The two dash properties go
     * through `style`, not `setAttribute`: a presentation attribute is the weakest source there is,
     * and setting it four times a second leaves the drawn arc lagging behind the number.
     */
    function renderProgress(left, total) {
      var ratio = total > 0 ? Math.max(0, Math.min(1, left / total)) : 0
      var run = el('run')
      run.style.strokeDasharray = CIRCUMFERENCE
      run.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio)
      el('barfill').style.width = (ratio * 100) + '%'
    }

    function applySize(size) {
      var px = (size && size.px) || { width: 320, height: 240 }
      document.documentElement.style.setProperty('--h', px.height + 'px')
      // The ring is as large as the shorter side allows, minus the label, dots and buttons above
      // and below it; under RING_MIN_PX there is nothing left for it and the bar takes over.
      var flat = px.height < RING_MIN_PX
      document.documentElement.classList.toggle('flat', flat)
      // Buttons grow with the tile, between a finger's minimum and a size that stays a button.
      var btn = Math.round(Math.max(40, Math.min(60, px.height * 0.17)))
      document.documentElement.style.setProperty('--btn', btn + 'px')
      // What the ring may take: the width, minus the padding, and the height minus the label, the
      // dots, the buttons and the gaps between them.
      // Padding, label, dots, three gaps and the buttons, plus breathing room at the bottom.
      var dial = Math.max(60, Math.min(px.width - 28, px.height - 104 - btn))
      var box = el('dial')
      box.style.width = flat ? '' : dial + 'px'
      box.style.height = flat ? '' : dial + 'px'
      // Inside the ring the time keeps clear of the stroke: five tabular digits at 0.22 of the
      // diameter span about two thirds of it, which leaves a margin either side.
      document.documentElement.style.setProperty('--time', (flat ? Math.min(px.height * 0.34, 56) : dial * 0.22) + 'px')
    }

    function render() {
      document.documentElement.lang = Fremkit.locale
      var left = remaining()
      var total = duration()
      var p = phase()
      el('phase').textContent = Fremkit.t(L[p])
      el('time').textContent = P.mmss(left)
      el('ctime').textContent = P.mmss(left)
      el('ctime').classList.toggle('cidle', !state.running)
      el('cglyph').innerHTML = glyph(p === 'work' ? 'work' : 'rest')
      el('toggle').textContent = Fremkit.t(state.running ? L.pause : L.start)
      el('skip').textContent = Fremkit.t(L.skip)
      el('reset').textContent = Fremkit.t(L.reset)
      renderProgress(left, total)
      renderDots()
    }

    function glyph(key) {
      var size = Math.round(Math.min(((Fremkit.size && Fremkit.size.px && Fremkit.size.px.height) || 80) * 0.42, 30))
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" ' +
        'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + GLYPHS[key] + '</svg>'
    }

    function tick() {
      if (state.running && Date.now() >= state.deadline) { advance(); render(); return }
      if (state.running) render()
    }

    el('toggle').addEventListener('click', toggle)
    el('skip').addEventListener('click', skip)
    el('reset').addEventListener('click', reset)

    Fremkit.onResize(function (size) { applySize(size); render() })
    // Live preview: a changed duration restarts the phase the widget is sitting in.
    Fremkit.onSettings(function (next) {
      s = next || {}
      if (!state.running) state.remaining = duration()
      render()
    })
    Fremkit.onLocale(render)

    if (!restore()) goTo(0, false)
    applySize(Fremkit.size)
    render()
    setInterval(tick, TICK_MS)
  })
</script></body></html>

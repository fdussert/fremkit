<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sessions Claude</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:14px 18px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .big{font-size:calc(44px * var(--text-scale, 1));font-weight:600;line-height:1}
  .bar{height:8px;border-radius:4px;background:var(--surface-3, #252a32);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent, #d9b36a);width:0;transition:width .4s}
  .row{display:flex;justify-content:space-between;font-size:calc(15px * var(--text-scale, 1))}
  .muted{color:var(--text-muted, #8b93a0)}
  button{font:inherit;border:0;border-radius:10px;background:var(--surface-3, #252a32);color:var(--text, #e6e8eb);padding:10px 14px;font-size:calc(18px * var(--text-scale, 1))}
  button:active{background:var(--accent, #d9b36a)}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* The host says which way round the tile is: on-light means dark text on a light body. */
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .muted,html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}
  /* A bar painted in the accent vanishes when the body *is* the accent, so it flips to the text colour. */
  html.on-light .bar,html.accent-fill .bar{background:rgba(128,128,128,.35)}
  html.accent-fill .bar>i{background:var(--on-surface,#0b0d10)}
</style>
<style>
  .wrap{justify-content:flex-start;gap:8px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));grid-auto-rows:max-content;gap:8px;flex:1;align-content:start;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-right:4px}
  .card{position:relative;border-radius:12px;padding:10px 12px;background:var(--surface-2, #1a1e24);border-left:6px solid var(--border-strong, #3a404a);display:flex;flex-direction:column;gap:4px;min-height:64px}
  .card.working{border-color:var(--accent, #d9b36a)}
  .card.permission{border-color:#f0a020;animation:pulse 1s infinite alternate}
  .card.done{border-color:var(--ok, #2fb36b)}
  .card.error{border-color:var(--danger, #d9463f)}
  .card.idle{border-color:var(--border-strong, #3a404a);opacity:.7}
  @keyframes pulse{from{background:var(--surface-2, #1a1e24)}to{background:#3a2f14}}
  /* The title keeps room to be read: when the status and the app do not fit beside it at that
     width ("attend ta permission" is long), they wrap under it rather than squeeze it. */
  .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px}
  .badge{font-size:calc(12px * var(--text-scale, 1));text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted, #8b93a0);white-space:nowrap;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .line{font-size:calc(14px * var(--text-scale, 1));color:#c3c8d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;gap:10px;font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);align-items:center}
  .sub{background:var(--accent, #d9b36a);color:var(--on-accent,#0b0d10);border-radius:8px;padding:0 6px;font-size:calc(11px * var(--text-scale, 1))}
  [hidden]{display:none!important}
  .hdr{display:flex;justify-content:flex-end;align-items:baseline;flex:0 0 auto}
  .stats{font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.04em}
  .title{font-size:calc(18px * var(--text-scale, 1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* The title is what tells one session from another: it keeps most of the row, and the state and
     the application give way first. */
  .head .title{flex:0 0 auto;max-width:100%}
  .head .badge,.head .client{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .head .client:empty,.head .badge:empty{display:none}
  .where{font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{display:flex;align-items:center;gap:8px;margin-top:auto;font-family:var(--font-mono, ui-monospace,SFMono-Regular,Menlo,monospace);font-size:calc(13px * var(--text-scale, 1));color:#c3c8d0;background:#0f1216;border-radius:8px;padding:5px 8px}
  .foot .model{color:var(--text, #e6e8eb);font-weight:600}
  .foot .sep{color:var(--text-muted, #8b93a0)}
  .foot .ctx{flex:1;height:6px;border-radius:3px;background:var(--surface-3, #252a32);overflow:hidden}.foot .ctx>i{display:block;height:100%}
  .ok{background:var(--ok, #2fb36b)}.warn{background:#f0a020}.hot{background:var(--danger, #d9463f)}
  .go{position:absolute;top:6px;right:6px;width:44px;height:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:10px;background:transparent;color:var(--text-muted, #8b93a0);font-size:calc(20px * var(--text-scale, 1));line-height:1}
  .go:active{background:var(--accent, #d9b36a);color:var(--on-accent,#0b0d10)}
  .card.permission .go{color:#f0a020}
  /* The button sits over the top-right corner, so the badge stops short of it. */
  .card .head{padding-right:44px}
  .tags{display:flex;align-items:baseline;gap:8px;min-width:0;max-width:100%}
  .client{font-size:calc(11px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);border:1px solid var(--border-strong, #3a404a);border-radius:6px;padding:0 5px;white-space:nowrap}
  .group{grid-column:1/-1;font-size:calc(12px * var(--text-scale, 1));text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted, #8b93a0);padding:6px 2px 0}
  /* Pinned sessions, kept at hand above the others: a name and the model's bar and nothing else,
     so that six of them still leave the board to the sessions that are moving. Same columns as
     the cards below, so the two line up. */
  .pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));grid-auto-rows:max-content;gap:6px 8px;flex:0 0 auto;max-height:60%;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-right:4px}
  .card.pin{min-height:0;padding:6px 10px;gap:4px}
  /* Most pinned sessions are idle; dimming every one of them would dim the whole row. */
  .card.pin.idle{opacity:1}
  .card.pin .title{font-size:calc(15px * var(--text-scale, 1))}
  .card.pin .foot{margin-top:0;padding:3px 8px;font-size:calc(12px * var(--text-scale, 1))}
  /* A long press pins: the card gives under the finger while it is being held, and the text
     must not get selected or call up the system's menu instead. */
  .card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .15s}
  .card.holding{transform:scale(.96);transition:transform .5s}
  .q{font-size:calc(14px * var(--text-scale, 1));color:var(--text, #e6e8eb);white-space:normal}.q b{display:block;font-size:calc(12px * var(--text-scale, 1));color:#f0a020;text-transform:uppercase;letter-spacing:.06em}.q ul{margin:2px 0 0 16px;padding:0;color:#c3c8d0;font-size:calc(13px * var(--text-scale, 1))}
</style>
</head>
<body><div class="wrap" id="wrap"><div class="hdr" id="hdr" hidden><span class="stats" id="stats"></span></div><div class="pins" id="pins" hidden></div><div class="cards" id="cards"></div></div>
<script>
  var L = {
    working: { fr: 'en travail', en: 'working' },
    permission: { fr: 'attend ta permission', en: 'waiting for you' },
    done: { fr: 'réponse prête', en: 'answer ready' },
    error: { fr: 'erreur', en: 'error' },
    idle: { fr: 'inactif', en: 'idle' },
    seconds: { fr: '{n} s', en: '{n} s' },
    minutes: { fr: '{n} min', en: '{n} min' },
    hoursMinutes: { fr: '{h} h {m} min', en: '{h} h {m} min' },
    millions: { fr: '{n} M', en: '{n}M' },
    thousands: { fr: '{n} k', en: '{n}k' },
    discovered: { fr: 'ouverte, pas d’activité vue', en: 'open, no activity seen' },
    silentFor: { fr: 'silence depuis {delay}', en: 'silent for {delay}' },
    agentOne: { fr: '1 agent', en: '1 agent' },
    agentMany: { fr: '{n} agents', en: '{n} agents' },
    contextUsed: { fr: 'ctx {tokens}', en: 'ctx {tokens}' },
    percent: { fr: '{n} %', en: '{n}%' },
    empty: { fr: 'Aucune session Claude', en: 'No Claude session' },
    today: { fr: '{sessions} aujourd’hui · {done} · {commits}', en: '{sessions} today · {done} · {commits}' },
    doneOne: { fr: '1 terminée', en: '1 finished' },
    doneMany: { fr: '{n} terminées', en: '{n} finished' },
    commitOne: { fr: '1 commit', en: '1 commit' },
    commitMany: { fr: '{n} commits', en: '{n} commits' },
    go: { fr: 'Aller à la session', en: 'Go to the session' },
    noWindow: { fr: 'fenêtre introuvable', en: 'cannot find its window' },
    ungrouped: { fr: 'Application inconnue', en: 'Unknown application' }
  }
  var LABELS = { working: L.working, permission: L.permission, done: L.done, error: L.error, idle: L.idle }
  var sessions = [], today = null, nodes = {}
  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return Fremkit.t(L.seconds, { n: s })
    var m = Math.floor(s / 60)
    if (m < 60) return Fremkit.t(L.minutes, { n: m })
    return Fremkit.t(L.hoursMinutes, { h: Math.floor(m / 60), m: m % 60 })
  }
  /** A decimal separator follows the language: a comma in French, a point in English. */
  function dec(n, digits) { var text = n.toFixed(digits); return Fremkit.locale === 'fr' ? text.replace('.', ',') : text }
  function tokens(n) {
    if (n >= 1e6) return Fremkit.t(L.millions, { n: dec(n / 1e6, 1) })
    if (n >= 1e3) return Fremkit.t(L.thousands, { n: Math.round(n / 1e3) })
    return String(n)
  }
  function cls(p) { return p < 60 ? 'ok' : p < 85 ? 'warn' : 'hot' }
  function lineFor(s, now) {
    if (s.question) return ''
    if (s.discovered) return Fremkit.t(L.discovered)
    var tool = s.tool ? s.tool + (s.toolDetail ? ' · ' + s.toolDetail : '') : ''
    if (s.state === 'working') return tool
    if (s.state === 'permission') return tool || s.lastMessage || ''
    if (s.state === 'error') return s.error || ''
    if (s.state === 'done') return (s.lastMessage ? s.lastMessage + ' · ' : '') + Fremkit.t(L.silentFor, { delay: ago(now - s.lastEventAt) })
    if (s.state === 'idle') return Fremkit.t(L.silentFor, { delay: ago(now - s.lastEventAt) })
    return ''
  }
  function metaFor(s, now) {
    var meta = '<span>' + ago(now - s.since) + '</span>'
    if (showCost && typeof s.costUsd === 'number') meta += '<span>$' + s.costUsd.toFixed(2) + '</span>'
    if (s.subagents > 0) meta += '<span class="sub">' + Fremkit.esc(plural(s.subagents, L.agentOne, L.agentMany)) + '</span>'
    return meta
  }
  function footFor(s) {
    var model = s.modelId ? s.modelId.replace(/^claude-/, '') : s.model
    if (!model) return ''
    var html = '<span class="model">' + Fremkit.esc(model) + '</span>'
    if (s.context) html += '<span class="sep">·</span><span>' + Fremkit.esc(Fremkit.t(L.contextUsed, { tokens: tokens(s.context.used) })) + '</span><span class="sep">·</span><span class="ctx"><i class="' + cls(s.context.pct) + '" style="width:' + Math.min(100, s.context.pct) + '%"></i></span><span>' + Fremkit.esc(Fremkit.t(L.percent, { n: Math.round(s.context.pct) })) + '</span>'
    return html
  }
  function build(s) {
    var card = document.createElement('div')
    card.setAttribute('data-id', s.sessionId)
    card.innerHTML = '<div class="head"><span class="title"></span><span class="tags"><span class="badge"></span><span class="client"></span></span></div><button class="go" type="button"></button><div class="where"></div><div class="q"></div><div class="line"></div><div class="meta"></div><div class="foot"></div>'
    return card
  }
  function update(card, s, now) {
    if (card.getAttribute('data-state') !== s.state) { card.className = 'card ' + s.state; card.setAttribute('data-state', s.state) }
    if (s.discovered) card.setAttribute('data-discovered', '1'); else card.removeAttribute('data-discovered')
    var title = s.title || s.repo || s.project
    card.querySelector('.title').textContent = title
    card.querySelector('.badge').textContent = LABELS[s.state] ? Fremkit.t(LABELS[s.state]) : s.state
    // Which application the session lives in, as the server named it. Two panes of the same
    // folder are the same project and the same branch; this is what tells them apart.
    var clientEl = card.querySelector('.client')
    clientEl.textContent = s.client ? s.client.label : ''
    clientEl.hidden = !s.client
    // A placeholder found by scanning processes has no hook, so nothing knows where it lives.
    var goEl = card.querySelector('.go')
    goEl.textContent = '\u2197'
    goEl.setAttribute('aria-label', Fremkit.t(L.go))
    // The repository's name, not the folder's: a session in a worktree or a subfolder of it would
    // otherwise read as a project of its own. Where in it comes after, then the branch.
    var place = s.repo ? s.repo + (s.place ? '/' + s.place : '') : s.project
    var where = place + (s.branch ? '@' + s.branch : ''), whereEl = card.querySelector('.where')
    if (where === title) where = ''
    whereEl.textContent = where; whereEl.hidden = !where
    var qEl = card.querySelector('.q')
    if (s.question) {
      qEl.innerHTML = (s.question.header ? '<b>' + Fremkit.esc(s.question.header) + '</b>' : '') + Fremkit.esc(s.question.text) + (s.question.options.length ? '<ul>' + s.question.options.map(function (o) { return '<li>' + Fremkit.esc(o) + '</li>' }).join('') + '</ul>' : '')
      qEl.hidden = false
    } else {
      qEl.hidden = true
    }
    // A refusal to go to the window outlives the next render, which would otherwise erase it
    // within the second.
    var line = (failedUntil[s.sessionId] > now) ? Fremkit.t(L.noWindow) : lineFor(s, now), lineEl = card.querySelector('.line')
    lineEl.textContent = line; lineEl.hidden = !line
    card.querySelector('.meta').innerHTML = metaFor(s, now)
    var footHtml = footFor(s), footEl = card.querySelector('.foot')
    footEl.innerHTML = footHtml; footEl.hidden = !footHtml
  }
  /** A pinned session's card: its name and the model's bar. The edge still says the state. */
  function buildPin(s) {
    var card = document.createElement('div')
    card.setAttribute('data-id', s.sessionId)
    card.innerHTML = '<span class="title"></span><div class="line" hidden></div><div class="foot"></div>'
    return card
  }
  function updatePin(card, s, now) {
    if (card.getAttribute('data-state') !== s.state) { card.className = 'card pin ' + s.state; card.setAttribute('data-state', s.state) }
    card.querySelector('.title').textContent = s.title || s.repo || s.project
    // The one line a pinned card can grow: that its window could not be found.
    var lineEl = card.querySelector('.line'), failed = failedUntil[s.sessionId] > now
    lineEl.textContent = failed ? Fremkit.t(L.noWindow) : ''; lineEl.hidden = !failed
    var footHtml = footFor(s), footEl = card.querySelector('.foot')
    footEl.innerHTML = footHtml; footEl.hidden = !footHtml
  }
  function isPinned(s) { return typeof s.pinnedAt === 'number' }
  /** The pinned sessions, in the order they were pinned. No filter applies: a pin is a choice. */
  function pinnedSessions() {
    return sessions.filter(isPinned).sort(function (a, b) { return a.pinnedAt - b.pinnedAt || (a.sessionId < b.sessionId ? -1 : 1) })
  }
  /** Only exactly one takes the singular: zero reads as a plural in both languages. */
  function plural(n, one, many) { return n === 1 ? Fremkit.t(one) : Fremkit.t(many, { n: n }) }
  function statsFor(t) {
    return Fremkit.t(L.today, {
      sessions: t.sessions,
      done: plural(t.done, L.doneOne, L.doneMany),
      commits: plural(t.commits, L.commitOne, L.commitMany),
    })
  }
  /** How long a finished session stays on the board when "hide finished" is on. */
  var HIDE_AFTER_MS = 30 * 60 * 1000
  /**
   * The sessions this tile is meant to show.
   *
   * The count in the header stays the real total: a filter is about what is worth looking at,
   * not about pretending the others are not running.
   */
  function visible(now) {
    // A pinned session is drawn above, once.
    var out = sessions.filter(function (s) { return !isPinned(s) })
    if (onlyWaiting) out = out.filter(function (s) { return s.state === 'permission' })
    if (hideDone) out = out.filter(function (s) {
      return !((s.state === 'done' || s.state === 'idle') && now - s.lastEventAt > HIDE_AFTER_MS)
    })
    // The server sends them by state, most recent first within each; this mixes the states.
    if (sortRecent) out = out.slice().sort(function (a, b) { return b.lastEventAt - a.lastEventAt })
    return out
  }
  /** Rows to draw: a card per session, and a heading before each run when grouping is on. */
  function rows(list) {
    if (!groupByClient) return list.map(function (s) { return { key: 'c:' + s.sessionId, session: s } })
    var byLabel = {}, order = []
    list.forEach(function (s) {
      var label = s.client ? s.client.label : Fremkit.t(L.ungrouped)
      if (!byLabel[label]) { byLabel[label] = []; order.push(label) }
      byLabel[label].push(s)
    })
    var out = []
    order.forEach(function (label) {
      out.push({ key: 'g:' + label, group: label })
      byLabel[label].forEach(function (s) { out.push({ key: 'c:' + s.sessionId, session: s } ) })
    })
    return out
  }
  function render() {
    var el = document.getElementById('cards'), now = Date.now(), seen = {}
    // The count goes after the tile's title, which the host draws: no title, no count.
    var note = showCount && sessions.length ? String(sessions.length) : ''
    if (note !== lastNote && Fremkit.titleNote) { lastNote = note; Fremkit.titleNote(note) }
    var stats = showStats && today ? statsFor(today) : ''
    document.getElementById('stats').textContent = stats
    document.getElementById('hdr').hidden = !stats
    // The count above keeps the real total; the list itself honours the filters and "max".
    var list = visible(now)
    if (maxShown > 0) list = list.slice(0, maxShown)
    var pinned = pinnedSessions(), pinsEl = document.getElementById('pins')
    pinsEl.hidden = !pinned.length
    pinned.forEach(function (s, i) {
      var key = 'p:' + s.sessionId, node = nodes[key]
      if (!node) { node = buildPin(s); nodes[key] = node }
      updatePin(node, s, now)
      if (pinsEl.children[i] !== node) pinsEl.insertBefore(node, pinsEl.children[i] || null)
      seen[key] = true
    })
    var empty = document.getElementById('empty')
    if (!list.length && !pinned.length) {
      if (!empty) { empty = document.createElement('div'); empty.id = 'empty'; empty.className = 'muted'; el.appendChild(empty) }
      empty.textContent = Fremkit.t(L.empty)
    } else if (empty) { empty.remove() }
    rows(list).forEach(function (row, i) {
      var node = nodes[row.key]
      if (row.group !== undefined) {
        if (!node) { node = document.createElement('div'); node.className = 'group'; nodes[row.key] = node }
        node.textContent = row.group
      } else {
        if (!node) { node = build(row.session); nodes[row.key] = node }
        update(node, row.session, now)
      }
      if (el.children[i] !== node) el.insertBefore(node, el.children[i] || null)
      seen[row.key] = true
    })
    Object.keys(nodes).forEach(function (key) { if (!seen[key]) { nodes[key].remove(); delete nodes[key] } })
  }
  /**
   * Ask the host to bring the session's window forward.
   *
   * The widget sends a session id and nothing else: where that session lives is something the
   * server holds and this tile has never been told, which is what makes a sandboxed iframe able
   * to ask for it at all. A refusal is shown on the card for a few seconds rather than swallowed
   * — "nothing happened" is exactly the state this whole thing exists to get rid of.
   */
  var failedUntil = {}
  function goTo(id, card) {
    function refused() {
      failedUntil[id] = Date.now() + 4000
      var line = card.querySelector('.line')
      line.textContent = Fremkit.t(L.noWindow); line.hidden = false
    }
    Fremkit.sendCommand('claude-sessions', 'focus', { sessionId: id }).then(function (r) {
      if (r && r.ok) return
      refused()
    }, refused)
  }
  /**
   * Pin a session, or let a pinned one go.
   *
   * Drawn at once, because a card that stays put for a second after a long press reads as a
   * press that did nothing; the server's next word replaces this guess either way, and a
   * refusal puts the card back.
   */
  function togglePin(id) {
    var s = sessions.filter(function (x) { return x.sessionId === id })[0]
    if (!s) return
    var pin = !isPinned(s), before = s.pinnedAt
    function undo() { if (before === undefined) delete s.pinnedAt; else s.pinnedAt = before; render() }
    if (pin) s.pinnedAt = Date.now(); else delete s.pinnedAt
    render()
    Fremkit.sendCommand('claude-sessions', 'pin', { sessionId: id, pinned: pin }).then(function (r) { if (!r || !r.ok) undo() }, undo)
  }
  /**
   * The long press, which arrives three ways and is answered once.
   *
   * On the Edge it never arrives as a held button: the touch driver says nothing while the
   * finger is down, and turns a press held past its threshold into a right click at the release
   * (`GestureEngine.endPress`), so a timer started on `pointerdown` never completes there. In
   * the helper's web view that right click raises no `contextmenu` either, so the right button
   * itself is the signal (`ui/src/dashboard/longPress.ts` tells the whole story). `contextmenu`
   * is what a browser sends for a long touch, and the timer is for a finger really held down:
   * a paired tablet, a mouse.
   *
   * Where two of the three are real they both fire for one press, and pinning twice is not
   * pinning: the first through wins and the rest of that gesture is silence (`PRESS_ECHO_MS`).
   * A touch that moves is a scroll and one that lifts early is a tap; the tap that follows a
   * press held to the end is swallowed, or pinning a card would also open it.
   */
  var HOLD_MS = 550, HOLD_SLOP = 10, PRESS_ECHO_MS = 700, hold = null, swallowClickUntil = 0
  // Not 0: a press in the page's first 700 ms would look like the echo of one that never was.
  var lastPressAt = -Infinity
  function longPressed(card) {
    endHold()
    var now = Date.now()
    if (now - lastPressAt < PRESS_ECHO_MS) return

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CleanShot X</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:#e6e8eb;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:10px;display:grid;gap:8px;align-content:stretch}
  button{font:inherit;border:0;border-radius:12px;background:#252a32;color:inherit;
         min-height:56px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:4px;line-height:1.1;cursor:pointer}
  button:active{background:var(--accent, #d9b36a);color:var(--on-accent, #0b0d10)}
  .glyph{font-size:clamp(20px,5vh,30px)}
  .label{font-size:clamp(11px,2.2vh,15px);text-align:center;overflow:hidden;text-overflow:ellipsis;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  /* A press answers with a brief tick or cross drawn over the glyph. */
  button.busy{opacity:.6}
  button.ok .glyph::after{content:' ✓';color:#3ddc84}
  button.fail .glyph::after{content:' ✗';color:#ff6b6b}
  .empty{font-size:14px;opacity:.7;align-self:center;justify-self:center;text-align:center;padding:0 12px}
  /* The host says which way round the tile is: on-light means dark text on a light body. */
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light button{background:rgba(128,128,128,.2)}
  html.accent-fill button{background:rgba(0,0,0,.18)}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
  /*
   * Every button is one entry of the server's allow-list: `id` is the action sent to the
   * `cleanshot` channel, and the server builds the cleanshot:// URL itself. Nothing here can
   * invent an action the provider does not already know.
   */
  var BUTTONS = [
    { id: 'capture-area', setting: 'showCaptureArea', glyph: '⛶',
      label: { fr: 'Zone', en: 'Area' } },
    { id: 'capture-window', setting: 'showCaptureWindow', glyph: '🪟',
      label: { fr: 'Fenêtre', en: 'Window' } },
    { id: 'capture-fullscreen', setting: 'showCaptureFullscreen', glyph: '🖥',
      label: { fr: 'Plein écran', en: 'Fullscreen' } },
    { id: 'scrolling-capture', setting: 'showScrollingCapture', glyph: '📜',
      label: { fr: 'Défilante', en: 'Scrolling' } },
    { id: 'capture-text', setting: 'showCaptureText', glyph: '🔡',
      label: { fr: 'Texte (OCR)', en: 'Text (OCR)' } },
    { id: 'record-screen', setting: 'showRecordScreen', glyph: '⏺',
      label: { fr: 'Enregistrer', en: 'Record' } },
    { id: 'capture-previous-area', setting: 'showCapturePreviousArea', glyph: '↺',
      label: { fr: 'Zone précédente', en: 'Previous area' } },
    { id: 'all-in-one', setting: 'showAllInOne', glyph: '✳',
      label: { fr: 'Tout-en-un', en: 'All-in-one' } },
    { id: 'self-timer', setting: 'showSelfTimer', glyph: '⏱',
      label: { fr: 'Retardateur', en: 'Self-timer' } },
    { id: 'open-history', setting: 'showOpenHistory', glyph: '🕘',
      label: { fr: 'Historique', en: 'History' } },
    { id: 'open-from-clipboard', setting: 'showOpenFromClipboard', glyph: '📋',
      label: { fr: 'Presse-papiers', en: 'Clipboard' } },
    { id: 'pin', setting: 'showPin', glyph: '📌',
      label: { fr: 'Épingler', en: 'Pin' } },
    { id: 'toggle-desktop-icons', setting: 'showToggleDesktopIcons', glyph: '🗂',
      label: { fr: 'Icônes du bureau', en: 'Desktop icons' } },
    { id: 'restore-recently-closed', setting: 'showRestoreRecentlyClosed', glyph: '♻',
      label: { fr: 'Restaurer', en: 'Restore' } }
  ]
  var L = { empty: { fr: 'Aucun bouton : choisissez des actions dans les réglages.',
                     en: 'No button: pick actions in the settings.' } }

  Fremkit.whenReady(function () {
    var wrap = document.getElementById('wrap')

    function flash(el, cls) {
      el.classList.remove('busy', 'ok', 'fail')
      el.classList.add(cls)
      setTimeout(function () { el.classList.remove(cls) }, 1200)
    }

    function press(el, id) {
      el.classList.add('busy')
      Fremkit.sendCommand('cleanshot', 'run', { action: id }).then(
        function (r) { flash(el, r && r.ok === false ? 'fail' : 'ok') },
        function () { flash(el, 'fail') }
      )
    }

    function build() {
      var cols = Math.max(1, Math.min(6, Number(Fremkit.settings.columns) || 3))
      wrap.innerHTML = ''
      var shown = BUTTONS.filter(function (b) { return Fremkit.settings[b.setting] !== false })
      if (!shown.length) {
        wrap.style.gridTemplateColumns = '1fr'
        var note = document.createElement('div')
        note.className = 'empty'
        note.textContent = Fremkit.t(L.empty)
        wrap.appendChild(note)
        return
      }
      wrap.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)'
      wrap.style.gridAutoRows = 'minmax(56px, 1fr)'
      shown.forEach(function (b) {
        var el = document.createElement('button')
        el.type = 'button'
        var g = document.createElement('span'); g.className = 'glyph'; g.textContent = b.glyph
        var t = document.createElement('span'); t.className = 'label'; t.textContent = Fremkit.t(b.label)
        el.appendChild(g); el.appendChild(t)
        el.title = Fremkit.t(b.label)
        el.onclick = function () { press(el, b.id) }
        wrap.appendChild(el)
      })
    }

    function render() { document.documentElement.lang = Fremkit.locale; build() }
    render()
    Fremkit.onSettings(render)
    Fremkit.onLocale(render)
  })
</script></body></html>

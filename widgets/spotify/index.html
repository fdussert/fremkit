<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spotify</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:14px 18px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .big{font-size:calc(44px * var(--text-scale, 1));font-weight:600;line-height:1}
  .bar{height:8px;border-radius:4px;background:var(--surface-3, #252a32);overflow:hidden}
  /* Scaled rather than resized: the position only arrives once a second, so the fill glides
     across that second on the compositor instead of stepping on each answer. */
  .bar>i{display:block;height:100%;width:100%;background:var(--accent, #d9b36a);
    transform:scaleX(0);transform-origin:left center;transition:transform 1s linear}
  /* A new track, or a seek: there is nothing to glide across, so it lands where it is. */
  .bar>i.snap{transition:none}
  .row{display:flex;justify-content:space-between;font-size:calc(15px * var(--text-scale, 1))}
  .muted{color:var(--text-muted, #8b93a0)}
  button{font:inherit;border:0;border-radius:10px;background:var(--surface-3, #252a32);color:var(--text, #e6e8eb);padding:10px 14px;font-size:calc(18px * var(--text-scale, 1))}
  button:active{background:var(--accent, #d9b36a)}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* The host says which way round the tile is: on-light means dark text on a light body. */
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .muted,html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}
  /* A bar painted in the accent vanishes when the body *is* the accent, so it flips to the text colour. */
  html.on-light .bar,html.accent-fill .bar{background:rgba(128,128,128,.35)}
  html.accent-fill .bar>i{background:var(--on-surface,#0b0d10)}
</style>
<style>
  /*
   * The iframe's own viewport is exactly the tile, so vw/vh/vmin track the tile size directly.
   *
   * One grid, three arrangements. The cover, the song and the transport never move in the
   * document; only the areas they sit in do. `.info` is a real box in the row — which is what
   * keeps the cover from pushing the song and the buttons apart when it is the taller of the
   * two — and steps out of the way with `display:contents` in the other two, so its children
   * become areas of their own.
   */
  .wrap{display:grid;align-content:center;
    column-gap:clamp(10px,3vw,20px);row-gap:0;
    padding:clamp(10px,3vh,18px) clamp(12px,3vw,20px);
    grid-template-columns:auto minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    grid-template-areas:"art info"}
  /* As tall as the row allows, and square: the height drives it, `aspect-ratio` gives the width,
     and the same cap on both keeps it square when the cap is what binds rather than the height. */
  #art{grid-area:art;align-self:center;justify-self:start;height:100%;width:auto;aspect-ratio:1/1;
    max-width:min(46vw,300px);max-height:min(46vw,300px);
    border-radius:10px;background:var(--surface-3, #252a32);object-fit:cover}
  .info{grid-area:info;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .song{min-width:0;display:flex;flex-direction:column;gap:clamp(2px,1vh,6px)}
  .rest{min-width:0;display:flex;flex-direction:column}
  /*
   * Type reads from whichever dimension the tile has to spare, and is held back by the other.
   *
   * Height alone left a 950×280 tile with a 21px title while it had room for thirty. Width alone
   * would give a 2560×120 banner a 76px one, which does not fit under it — hence the inner
   * `min`, which lets the width raise the size only as far as the height can carry it.
   */
  #title{font-size:calc(clamp(14px,max(6vh,min(3vw,20vh)),40px) * var(--text-scale, 1));font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #artist{font-size:calc(clamp(11px,max(3.4vh,min(1.6vw,11vh)),22px) * var(--text-scale, 1));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Thick enough to read as a track from across the room, and clear of the buttons: at 4px under
     a 4px gap it looked like an underline on the transport rather than a bar of its own. */
  .rest .bar{height:clamp(5px,1.8vh,12px);border-radius:999px;margin-top:clamp(4px,2.6vh,18px)}
  /* Transport under the song: wide, tall buttons that a finger can hit without aiming. */
  .controls{display:flex;gap:clamp(8px,1.5vw,14px);margin-top:clamp(4px,1.2vh,10px)}
  .controls button{flex:1;min-height:44px;font-size:calc(clamp(20px,6vh,34px) * var(--text-scale, 1));line-height:1;padding:clamp(8px,2vh,16px) 0;border-radius:clamp(8px,1.8vh,14px)}
  /*
   * Wide enough for a title beside the cover, and tall enough that the row would leave a hole:
   * the cover moves beside the song alone and the transport takes the whole width underneath.
   *
   * The two numbers are where the row stops working. Under 440px the title has nowhere to go
   * beside a cover; under 340px of height the cover left in the top row would be smaller than
   * the one the row was already giving, so the row stays. Above both, the row's right-hand
   * column carries about 190px of content against a cover of 300 — the hole this closes.
   */
  @media (min-height:340px) and (min-width:440px){
    .wrap{grid-template-areas:"art song" "rest rest";grid-template-rows:minmax(0,1fr) auto;
      row-gap:clamp(4px,1.2vh,10px)}
    .info{display:contents}
    .song{grid-area:song;align-self:center}
    .rest{grid-area:rest}
    #art{max-width:min(40vw,320px);max-height:min(40vw,320px)}
  }
  /*
   * Squarer than that, or taller than wide, and the cover is the point: it goes on top, alone,
   * taking the height the song and the transport leave. Through the grid rather than by
   * subtracting a guessed number, since the type and the buttons are sized in vh and any guess
   * would drift.
   */
  @media (min-height:300px) and (max-aspect-ratio:23/20){
    .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"art" "song" "rest";
      grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;text-align:center}
    .info{display:contents}
    .song{grid-area:song;align-self:auto}
    .rest{grid-area:rest}
    /* The row is what is left over, so the height drives it here too; capping both sides by the
       same width-derived number is what keeps it square when the width is what binds. */
    #art{justify-self:center;height:100%;min-height:0;
      max-width:min(calc(100vw - 40px),460px);max-height:min(calc(100vw - 40px),460px)}
    .song,.rest{width:100%}
    #title,#artist{white-space:normal;overflow-wrap:anywhere}
  }
</style></head><body><div class="wrap">
<img id="art" alt="">
<div class="info">
<div class="song"><div id="title"></div><div id="artist" class="muted"></div></div>
<div class="rest">
<div class="controls"><button id="prev">⏮</button><button id="pp">⏯</button><button id="next">⏭</button></div>
<div class="bar"><i id="bar"></i></div></div></div>
</div>
<script>
  var L = {
    error: { fr: 'Erreur Spotify', en: 'Spotify error' },
    closed: { fr: 'Spotify fermé', en: 'Spotify is closed' },
    stopped: { fr: 'Rien en lecture', en: 'Nothing playing' }
  }
  Fremkit.whenReady(function () {
    var last = null
    function render() {
      var t = document.getElementById('title'), a = document.getElementById('artist'), img = document.getElementById('art')
      document.documentElement.lang = Fremkit.locale
      var d = last
      if (!d) { t.textContent = Fremkit.t(L.closed); return }
      if (d.error) { t.textContent = Fremkit.t(L.error); a.textContent = ''; img.removeAttribute('src'); return }
      if (!d.available) { t.textContent = Fremkit.t(L.closed); a.textContent = ''; img.removeAttribute('src'); return }
      if (d.state === 'stopped') { t.textContent = Fremkit.t(L.stopped); a.textContent = ''; return }
      t.textContent = d.title; a.textContent = d.artist + ' · ' + d.album
      if (d.artwork && img.src !== d.artwork) img.src = d.artwork
      renderBar(d)
      document.getElementById('pp').textContent = d.state === 'playing' ? '⏸' : '▶'
    }
    /**
     * How far apart two positions arrive. The provider polls Spotify once a second, and a bar
     * that moved only when an answer landed read as a step every second — so while the track
     * plays the fill is sent to where it will be at the *next* answer, and takes that second to
     * get there. Each answer then corrects the aim, so drift never accumulates.
     */
    var POLL_MS = 1000
    var lastKey = null
    var lastPositionMs = 0

    function renderBar(d) {
      var bar = document.getElementById('bar')
      var here = d.durationMs ? Math.min(1, d.positionMs / d.durationMs) : 0
      var key = d.title + '\u001f' + d.album
      // Backwards, or another track: gliding there would run the fill the wrong way for a second.
      var snap = key !== lastKey || d.positionMs < lastPositionMs - 250
      lastKey = key
      lastPositionMs = d.positionMs
      if (snap) {
        bar.className = 'snap'
        bar.style.transform = 'scaleX(' + here + ')'
        void bar.offsetWidth  // the reflow that makes the transition below start from here
        bar.className = ''
      }
      var ahead = d.state === 'playing' && d.durationMs
        ? Math.min(1, (d.positionMs + POLL_MS) / d.durationMs) : here
      bar.style.transform = 'scaleX(' + ahead + ')'
    }

    render()
    Fremkit.onLocale(render)
    Fremkit.subscribe('spotify', function (d) { last = d; render() })
    document.getElementById('pp').onclick = function () { Fremkit.sendCommand('spotify', 'playPause') }
    document.getElementById('next').onclick = function () { Fremkit.sendCommand('spotify', 'next') }
    document.getElementById('prev').onclick = function () { Fremkit.sendCommand('spotify', 'previous') }

    /*
     * A long press anywhere on the tile brings the Spotify application forward.
     *
     * Off unless the user turns it on: a tile you touch to pause should not leave the dashboard
     * by surprise. The press is cancelled by a release, a cancel, or a finger that travels —
     * which on a touch panel it always does a little, hence the slack.
     */
    var HOLD_MS = 500
    var SLACK_PX = 10
    var holdTimer = null
    var holdAt = null
    var suppressClick = false

    function holdCancel() {
      if (holdTimer !== null) { clearTimeout(holdTimer); holdTimer = null }
      holdAt = null
    }

    /*
     * The long press as the Edge's touch driver delivers it: a press held past its threshold
     * becomes a right click, so what reaches the page is a `contextmenu` event and never a held
     * button. The bridge prevents that event's default (no menu on the panel) but does not stop
     * it propagating, so this listener still runs.
     *
     * The pointer timer below stays for a real mouse and for the plain-Chrome kiosk path.
     */
    document.addEventListener('contextmenu', function () {
      if (Fremkit.settings.longPressOpensApp !== true) return
      holdCancel()
      suppressClick = true
      Fremkit.sendCommand('spotify', 'activate')
    })

    document.addEventListener('pointerdown', function (e) {
      if (Fremkit.settings.longPressOpensApp !== true) return
      // The driver's long press arrives as a right button; it would only cancel its own hold.
      if (e.button !== 0) return
      holdAt = { x: e.clientX, y: e.clientY }
      suppressClick = false
      holdTimer = window.setTimeout(function () {
        holdTimer = null
        holdAt = null
        // The press became a gesture of its own: the tap it would otherwise have been is dropped.
        suppressClick = true
        Fremkit.sendCommand('spotify', 'activate')
      }, HOLD_MS)
    })
    document.addEventListener('pointermove', function (e) {
      if (!holdAt) return
      if (Math.abs(e.clientX - holdAt.x) > SLACK_PX || Math.abs(e.clientY - holdAt.y) > SLACK_PX) holdCancel()
    })
    document.addEventListener('pointerup', holdCancel)
    document.addEventListener('pointercancel', holdCancel)
    // Capture, so the button handlers above never see the click the long press swallowed.
    document.addEventListener('click', function (e) {
      if (!suppressClick) return
      suppressClick = false
      e.stopPropagation()
      e.preventDefault()
    }, true)
  })
</script></body></html>

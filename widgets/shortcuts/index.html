<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shortcuts</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [hidden]{display:none!important}
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}
</style>
<style>
  .grid{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:10px;
    /* Rows are at least a finger tall and share whatever height is left, so a few buttons fill
       the tile and many of them scroll. */
    grid-auto-rows:minmax(var(--btn,72px),1fr)}
  /* One finger-sized button per entry: the icon or glyph on top, the label under it. */
  .btn{box-sizing:border-box;font:inherit;border:0;border-radius:14px;min-height:var(--btn,72px);padding:10px 8px;
    background:rgba(128,128,128,.18);color:inherit;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;text-align:center;cursor:pointer;overflow:hidden}
  .btn .art{flex:0 0 auto;width:var(--art,34px);height:var(--art,34px);display:flex;align-items:center;justify-content:center}
  .btn img.art{border-radius:8px;object-fit:contain}
  /* The browser profile a link opens in, as its initial in the button's corner. */
  .btn .profile{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;
    border-radius:9px;background:var(--accent,#d9b36a);color:var(--on-accent,#0b0d10);font-size:11px;font-weight:700;
    line-height:18px;text-align:center}
  html.bg-accent .btn .profile{background:var(--on-accent,#0b0d10);color:var(--accent,#d9b36a)}
  .btn:not(.back){position:relative}
  .btn .glyph{width:var(--art,34px);height:var(--art,34px);border-radius:50%;background:var(--accent,#d9b36a);
    color:var(--on-accent,#0b0d10);display:flex;align-items:center;justify-content:center;
    font-size:calc(calc(var(--art,34px) * .5) * var(--text-scale, 1));line-height:1}
  html.accent-fill .btn .glyph{background:var(--on-surface,#0b0d10);color:var(--accent,#d9b36a)}
  /* An emoji the user chose stands on its own, with no disc behind it. */
  .btn .emoji{font-size:calc(var(--art,34px) * .8);line-height:1}
  .btn .name{max-width:100%;font-size:calc(var(--body,15px) * var(--text-scale, 1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* The background setting: none, the accent, or a colour of the user's with its own text colour. */
  html.bg-none .btn{background:transparent}
  html.bg-accent .btn{background:var(--accent,#d9b36a);color:var(--on-accent,#0b0d10)}
  html.bg-accent .btn .glyph{background:var(--on-accent,#0b0d10);color:var(--accent,#d9b36a)}
  html.bg-custom .btn{background:var(--btn-bg);color:var(--btn-fg)}
  html.bg-custom .btn .glyph{background:var(--btn-fg);color:var(--btn-bg)}
  html .btn.pressed{background:var(--accent,#d9b36a);color:var(--on-accent,#0b0d10)}
  html .btn.pressed .glyph{background:currentColor;color:var(--accent,#d9b36a)}
  html.bg-accent .btn.pressed{background:var(--on-accent,#0b0d10);color:var(--accent,#d9b36a)}
  html.bg-accent .btn.pressed .glyph{background:currentColor;color:var(--on-accent,#0b0d10)}
  html .btn.ok{background:rgba(52,152,86,.38)}
  html .btn.failed{background:rgba(179,38,30,.38)}
  html.tight .btn{padding:8px 6px;gap:4px}
  /* Rows too short for an icon over a label put them side by side instead. */
  html.short .btn{flex-direction:row;padding:4px 10px;gap:8px}
  html.short .btn .name{flex:1 1 auto;text-align:left}
  /* A group shows what it holds: up to four of its buttons' icons in a little square, a folder's
     look. */
  .btn .minis{box-sizing:border-box;width:var(--art,34px);height:var(--art,34px);padding:3px;gap:2px;border-radius:24%;
    display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;place-items:center;background:rgba(128,128,128,.24)}
  html.bg-accent .btn .minis,html.bg-custom .btn .minis{background:rgba(0,0,0,.16)}
  .btn .minis .art{width:calc(var(--art,34px) * .4);height:calc(var(--art,34px) * .4)}
  .btn .minis img.art{border-radius:3px}
  .btn .minis .glyph{font-size:calc(var(--art,34px) * .2)}
  .btn .minis .emoji{font-size:calc(var(--art,34px) * .3)}
  /* An open group keeps the rows of the grid it replaced, never stretched: what does not fit
     scrolls. */
  .grid.in-group{grid-auto-rows:var(--btn,72px);align-content:start}
  /* Back out of a group: the first cell, drawn as an outline so it never reads as a shortcut, and
     held in place while the group's buttons scroll under it. */
  html .btn.back{position:sticky;top:0;z-index:1;background:rgba(16,18,22,.55);-webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);box-shadow:inset 0 0 0 2px rgba(128,128,128,.4)}
  html.on-light .btn.back{background:rgba(255,255,255,.55)}
  html .btn.back .glyph{background:transparent;color:inherit;font-size:calc(var(--art,34px) * .8);font-weight:300}

  /* Opening a group: the grid steps back, then the group's buttons fly out of the one touched,
     one after the other. Closing it runs the other way, into the back button. */
  .grid.leaving .btn{animation:leave .16s ease-in forwards}
  .grid.opening .btn{animation:fly-out .42s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:calc(var(--i,0) * 32ms)}
  .grid.closing .btn{animation:fly-in .16s ease-in forwards}
  .grid.settling .btn{animation:settle .3s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 18ms)}
  .grid.settling .btn.home{animation:home .5s cubic-bezier(.2,.9,.25,1.2) both}
  @keyframes leave{to{opacity:0;transform:scale(.9)}}
  @keyframes fly-out{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.3)}60%{opacity:1}to{opacity:1;transform:none}}
  @keyframes fly-in{to{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.3)}}
  @keyframes settle{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes home{from{opacity:.4;transform:scale(.7)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.grid .btn{animation:none!important}}
</style></head>
<body><div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="note" id="empty" hidden></div>
</div>
<script>
  var L = {
    empty: { fr: 'Ajoutez des boutons dans les réglages', en: 'Add buttons in the widget settings' },
    back: { fr: 'Retour', en: 'Back' }
  }
  /** How long a button keeps its ✓ or ✗ after a tap. */
  var FEEDBACK_MS = 1400
  /** The helper uploads Dock icons as it discovers them; a missing one is retried, not final. */
  var ICON_RETRY_MS = 30000
  /** Applications are installed rarely, and the server caches the scan: once an hour is plenty. */
  var INSTALLED_REFRESH_MS = 3600000
  var KINDS = { app: '□', url: '↗', shortcut: '⚡' }
  /** A group with nothing to show inside it yet. */
  var GROUP_GLYPH = '▦'
  /** How long the grid takes to step back before the next view flies in. */
  var LEAVE_MS = 160

  var settings = {}, dock = null
  /** Every installed application, from `/api/apps/installed`; empty until the first answer. */
  var installed = []
  /** button key -> 'pressed' | 'ok' | 'failed', cleared by a timer. */
  var feedback = {}
  /**
   * Where the group shown in place of the grid sits: its saved index, then the subgroup's index
   * inside it. Empty while the grid itself is shown.
   */
  var openPath = []
  /** Bumped by every view change, so a transition overtaken by another one stops. */
  var viewToken = 0
  /** How deep groups go: a group, and a subgroup inside it. */
  var MAX_DEPTH = 2

  /** One saved button as the grid draws it, or null for a half-typed one, which is not a button. */
  function plain(b, path) {
    if (!b || typeof b !== 'object') return null
    var spec = {
      // Where it sits in the saved lists, which is all the host is told: the rows skipped here
      // must not shift the buttons after them.
      path: path,
      key: path.join('.'),
      label: typeof b.label === 'string' ? b.label.trim() : '',
      kind: KINDS[b.kind] ? b.kind : 'app',
      target: typeof b.target === 'string' ? b.target.trim() : '',
      icon: typeof b.icon === 'string' ? b.icon.trim() : '',
      // `Brave — Perso`: only a link opens in a browser profile.
      profile: b.kind === 'url' && typeof b.profile === 'string' ? b.profile.trim() : ''
    }
    return spec.target === '' ? null : spec
  }

  /**
   * One saved button or group, as drawn; a group holds what it draws in turn, a subgroup too,
   * no deeper. A group with neither a name nor a button yet is an unfinished row.
   */
  function entry(b, path) {
    if (!b || b.kind !== 'group' || path.length > MAX_DEPTH) return plain(b, path)
    var held = (Array.isArray(b.items) ? b.items : [])
      .map(function (child, at) { return entry(child, path.concat(at)) })
      .filter(Boolean)
    var label = typeof b.label === 'string' ? b.label.trim() : ''
    if (!label && !held.length) return null
    return { path: path, key: 'g' + path.join('.'), kind: 'group', label: label, items: held,
      icon: typeof b.icon === 'string' ? b.icon.trim() : '' }
  }

  /** The buttons actually drawn: the plain ones with a target, and the groups. */
  function buttons() {
    var list = Array.isArray(settings.buttons) ? settings.buttons : []
    return list.map(function (b, index) { return entry(b, [index]) }).filter(Boolean)
  }

  /** The group open now, as `buttons()` draws it, or null when it is gone from the settings. */
  function currentGroup() {
    var list = buttons(), found = null
    for (var depth = 0; depth < openPath.length; depth++) {
      found = null
      for (var i = 0; i < list.length; i++) {
        if (list[i].kind === 'group' && list[i].path[depth] === openPath[depth]) { found = list[i]; break }
      }
      if (!found) return null
      list = found.items
    }
    return found
  }

  /** What the grid shows: the buttons, or an open group's behind a back button. */
  function view() {
    var group = currentGroup()
    if (!group) return buttons()
    return [{ key: 'back', kind: 'back', label: group.label }].concat(group.items)
  }

  /** Every plain button, the ones inside groups included. */
  function allPlain() {
    var out = []
    function walk(list) { list.forEach(function (b) { if (b.kind === 'group') walk(b.items); else out.push(b) }) }
    walk(buttons())
    return out
  }

  /** True when a candidate name is the one the button targets. `open -a` ignores `.app` and case. */
  function sameApp(candidate, wanted) {
    var name = String(candidate || '').toLowerCase()
    return name !== '' && (name === wanted || name === wanted + '.app' || name + '.app' === wanted)
  }

  /**
   * The bundle id for an application name, so the server's icon route can be asked.
   *
   * Every installed application first — that list covers anything the user can type — then the
   * Dock, which is all there was before and still answers while the scan is in flight.
   */
  function bundleIdFor(name) {
    var wanted = name.toLowerCase()
    for (var i = 0; i < installed.length; i++) {
      // Some bundles are named one thing and filed under another ("Code.app" for "Visual Studio Code").
      if (sameApp(installed[i].name, wanted) || sameApp(installed[i].file, wanted)) return installed[i].bundleId
    }
    var apps = dock && Array.isArray(dock.apps) ? dock.apps : []
    for (var j = 0; j < apps.length; j++) {
      if (sameApp(apps[j].name, wanted)) return apps[j].bundleId
    }
    return null
  }

  /** The bundle ids the buttons currently resolve to, as one string: the render trigger. */
  function resolution() {
    return allPlain().map(function (b) { return b.kind === 'app' ? bundleIdFor(b.target) : '' }).join('|')
  }

  function glyph(kind) { return Fremkit.el('span', 'art glyph', KINDS[kind] || KINDS.app) }

  /**
   * The site's own icon for a link button, served (and cached for a week) by the server.
   *
   * Only http(s) links have one — a `mailto:` keeps the glyph — and a site with no icon, or one
   * the server could not fetch, falls back to the glyph as soon as the image fails to load.
   */
  function favicon(button, spec, site, exact) {
    if (!/^https?:\/\//i.test(site)) return glyph(spec.kind)
    var art = glyph(spec.kind)
    // Through the host, never as an <img src="/api/favicon…">: this frame's origin is opaque and
    // the server refuses what looks like a foreign page's request. A site that is down when the
    // dashboard loads (right after a boot, say) is asked again until its icon lands.
    function attempt() {
      // An address the user typed as the icon is first taken as the image itself, then as a site.
      var icon = exact ? Fremkit.image(site).catch(function () { return Fremkit.favicon(site) }) : Fremkit.favicon(site)
      icon.then(function (src) {
        if (!button.isConnected || !art.parentNode) return
        var img = document.createElement('img')
        img.className = 'art'
        img.alt = ''
        img.src = src
        art.parentNode.replaceChild(img, art)
        art = img
      }, function () {
        if (!button.isConnected || !art.parentNode) return
        button.retryTimer = setTimeout(attempt, ICON_RETRY_MS)
      })
    }
    attempt()
    return art
  }

  /**
   * The emoji the user chose for a button, standing in for any icon; the first two characters
   * are kept. (An address there instead is the image to draw — or, when it is no image, a site
   * whose icon the button borrows — for a link whose own site only paints its icon once signed in.)
   */
  function emoji(text) { return Fremkit.el('span', 'art emoji', Array.from(text).slice(0, 2).join('')) }

  /** How an icon picked from the user's library is stored: `file:` and its name. */
  var LIBRARY = 'file:'

  /**
   * An icon the user imported into their library, asked of the host (`Fremkit.libraryIcon`): it
   * draws the kind's glyph until the image lands, and keeps it if the file is gone.
   */
  function libraryArt(button, spec) {
    var art = spec.kind === 'group' ? Fremkit.el('span', 'art glyph', GROUP_GLYPH) : glyph(spec.kind)
    Fremkit.libraryIcon(spec.icon).then(function (src) {
      if (!button.isConnected || !art.parentNode) return
      var img = document.createElement('img')
      img.className = 'art'
      img.alt = ''
      img.src = src
      art.parentNode.replaceChild(img, art)
      art = img
    }, function () { /* the glyph stands */ })
    return art
  }

  /**
   * The artwork of one button: the application's Dock icon when the server has one, and the
   * kind's glyph otherwise — rebuilt as an `<img>` every thirty seconds until an icon lands.
   */
  function artwork(button, spec) {
    if (spec.icon.indexOf(LIBRARY) === 0) return libraryArt(button, spec)
    var site = /^https?:\/\//i.test(spec.icon)
    if (spec.icon && !site) return emoji(spec.icon)
    // Turning icons off fetches nothing, a chosen site's icon included.
    if (settings.showIcons === false) return glyph(spec.kind)
    if (site) return favicon(button, spec, spec.icon, true)
    if (spec.kind === 'url') return favicon(button, spec, spec.target)
    if (spec.kind !== 'app') return glyph(spec.kind)
    var bundleId = bundleIdFor(spec.target)
    if (!bundleId) return glyph(spec.kind)
    var art = glyph(spec.kind)
    function attach() {
      Fremkit.appIcon(bundleId).then(function (src) {
        if (!button.isConnected || !art.parentNode) return
        var img = document.createElement('img')
        img.className = 'art'
        img.alt = ''
        img.src = src
        art.parentNode.replaceChild(img, art)
        art = img
      }, function () {
        if (!button.isConnected || !art.parentNode) return
        button.retryTimer = setTimeout(attach, ICON_RETRY_MS)
      })
    }
    attach()
    return art
  }

  /**
   * Shows the outcome of a tap on one button.
   *
   * Only that button is rebuilt: a full render would re-request every application icon, and the
   * grid would blink each time a finger lands on it.
   */
  function mark(spec, state) {
    feedback[spec.key] = state
    replace(spec.key)
    setTimeout(function () {
      if (feedback[spec.key] !== state) return
      delete feedback[spec.key]
      replace(spec.key)
    }, FEEDBACK_MS)
  }

  function replace(key) {
    var grid = document.getElementById('grid')
    var specs = view()
    for (var i = 0; i < grid.children.length; i++) {
      var old = grid.children[i]
      if (old.key !== key) continue
      var spec = specs.filter(function (s) { return s.key === key })[0]
      if (!spec) return
      clearTimeout(old.retryTimer)
      grid.replaceChild(buttonFor(spec, i), old)
      return
    }
  }

  function press(spec) {
    mark(spec, 'pressed')
    // Only where the button sits: the host reads what it points at from the saved settings, so a
    // widget cannot ask it to open something the user never configured.
    var request = { instanceId: Fremkit.instanceId, index: spec.path[0] }
    if (spec.path.length > 1) request.item = spec.path[1]
    if (spec.path.length > 2) request.sub = spec.path[2]
    Fremkit.sendCommand('shortcuts', 'open', request)
      .then(function (result) { mark(spec, result && result.ok ? 'ok' : 'failed') })
      .catch(function () { mark(spec, 'failed') })
  }

  /** A group's face: its own icon when it has one, else a little square of what it holds. */
  function groupArt(button, spec) {
    if (spec.icon.indexOf(LIBRARY) === 0) return libraryArt(button, spec)
    var site = /^https?:\/\//i.test(spec.icon)
    // Turning icons off fetches nothing, as for a button: the group shows what it holds instead.
    if (site && settings.showIcons !== false) return favicon(button, { kind: 'url' }, spec.icon, true)
    if (spec.icon && !site) return emoji(spec.icon)
    if (!spec.items.length) return Fremkit.el('span', 'art glyph', GROUP_GLYPH)
    var box = Fremkit.el('span', 'minis')
    spec.items.slice(0, 4).forEach(function (child) { box.appendChild(child.kind === 'group' ? subgroupFace(button, child) : artwork(button, child)) })
    return box
  }

  /** A subgroup in its group's little square: its own icon, or the group glyph. */
  function subgroupFace(button, spec) {
    if (spec.icon.indexOf(LIBRARY) === 0) return libraryArt(button, spec)
    if (spec.icon && !/^https?:\/\//i.test(spec.icon)) return emoji(spec.icon)
    return Fremkit.el('span', 'art glyph', GROUP_GLYPH)
  }

  function buttonFor(spec, position) {
    var state = feedback[spec.key]
    var button = Fremkit.el('button', 'btn' + (spec.kind === 'group' ? ' group' : spec.kind === 'back' ? ' back' : '') + (state ? ' ' + state : ''))
    button.key = spec.key
    button.style.setProperty('--i', position)
    button.appendChild(state === 'ok' ? Fremkit.el('span', 'art glyph', '✓')
      : state === 'failed' ? Fremkit.el('span', 'art glyph', '✗')
      : spec.kind === 'back' ? Fremkit.el('span', 'art glyph', '‹')
      : spec.kind === 'group' ? groupArt(button, spec)
      : artwork(button, spec))
    button.appendChild(Fremkit.el('div', 'name', spec.kind === 'back' ? (spec.label || Fremkit.t(L.back)) : (spec.label || spec.target)))
    var initial = settings.profileBadge === false ? '' : profileInitial(spec.profile)
    if (initial) {
      var badge = Fremkit.el('span', 'profile', initial)
      badge.title = spec.profile
      button.appendChild(badge)
    }
    button.onclick = spec.kind === 'group' ? function () { openGroupAt(spec, button) }
      : spec.kind === 'back' ? function () { closeGroup() }
      : function () { press(spec) }
    if (spec.kind === 'back') button.setAttribute && button.setAttribute('aria-label', Fremkit.t(L.back))
    return button
  }

  /**
   * "P" for `Brave — Perso`, "2" for `Brave — Profile 2`, a folder name being all macOS may let
   * the server read; a profile typed without a browser gets no badge.
   */
  function profileInitial(profile) {
    var m = /^\S+\s+[—–-]\s+(.+)$/.exec(profile || '')
    var folder = m ? /^Profile (\d+)$/.exec(m[1].trim()) : null
    if (folder) return folder[1]
    var first = m ? Array.from(m[1].trim())[0] : ''
    return first ? first.toUpperCase() : ''
  }

  function reducedMotion() {
    return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches
  }

  /** The centre of an element, relative to the grid's own box; null where nothing is laid out. */
  function centre(el) {
    if (!el || typeof el.getBoundingClientRect !== 'function') return null
    var r = el.getBoundingClientRect()
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 }
  }

  /** Sets each button's offset to `from`, the point the fly-out starts at and the fly-in ends at. */
  function aimAt(grid, from) {
    if (!from) return
    for (var i = 0; i < grid.children.length; i++) {
      var c = centre(grid.children[i])
      if (!c) continue
      grid.children[i].style.setProperty('--dx', (from.x - c.x) + 'px')
      grid.children[i].style.setProperty('--dy', (from.y - c.y) + 'px')
    }
  }

  /**
   * Swaps the grid for another view with a transition: `before` runs on the buttons going away,
   * `after` on the ones arriving, each a class on the grid. A newer swap overtakes an older one.
   */
  function swap(before, after, prepare) {
    var grid = document.getElementById('grid')
    var token = ++viewToken
    if (reducedMotion()) { render(); return }
    if (before) grid.classList.add(before)
    setTimeout(function () {
      if (token !== viewToken) return
      grid.classList.remove(before)
      render()
      if (prepare) prepare(grid)
      grid.classList.add(after)
      setTimeout(function () { if (token === viewToken) grid.classList.remove(after) }, 900)
    }, before ? LEAVE_MS : 0)
  }

  function openGroupAt(spec, button) {
    var from = centre(button)
    openPath = spec.path.slice()
    swap('leaving', 'opening', function (grid) { aimAt(grid, from) })
  }

  /** Back one level: from a subgroup to its group, from a group to the grid. */
  function closeGroup() {
    if (!openPath.length) return
    var grid = document.getElementById('grid')
    var group = openPath.join('.')
    openPath = openPath.slice(0, -1)
    // The buttons fly back into the first cell, the back button, before the grid returns.
    aimAt(grid, centre(grid.children[0]))
    swap('closing', 'settling', function (g) {
      for (var i = 0; i < g.children.length; i++) {
        if (g.children[i].key === 'g' + group) g.children[i].classList.add('home')
      }
    })
  }

  var BACKGROUNDS = { tinted: 1, accent: 1, custom: 1, none: 1 }
  var GAP = 10

  /** WCAG relative luminance of a `#rrggbb`, or null when it is not one. */
  function luminance(hex) {
    var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '')
    if (!m) return null
    var lin = function (c) { c = parseInt(c, 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4) }
    return 0.2126 * lin(m[1]) + 0.7152 * lin(m[2]) + 0.0722 * lin(m[3])
  }

  /** The background the buttons wear, as a class on <html>, and the chosen colour's text colour. */
  function applyBackground() {
    var root = document.documentElement
    var mode = BACKGROUNDS[settings.background] ? settings.background : 'tinted'
    Object.keys(BACKGROUNDS).forEach(function (m) { root.classList.toggle('bg-' + m, m === mode) })
    var custom = Fremkit.color(settings.color, '#d9b36a')
    root.style.setProperty('--btn-bg', custom)
    var l = luminance(custom)
    root.style.setProperty('--btn-fg', l !== null && l > 0.45 ? '#0b0d10' : '#fff')
  }

  /** The shortest a row goes before the grid scrolls: the touch-target floor. */
  var MIN_ROW = 44
  /** Below this a row cannot stack an icon over a label; the button lays them side by side. */
  var STACK_ROW = 62

  /**
   * Sizes the rows, the artwork and the label to the tile: the grid shares the tile's height
   * between the rows it needs — two rows of buttons are tall, with big icons; six rows are
   * short, with the label beside the icon — and only past the touch-target floor does it scroll.
   * An open group is sized by the grid it replaced, `count` being that grid's, so its buttons are
   * the ones the user just saw; more of them than fit scroll.
   */
  function applyRowSize(grid, count, cols) {
    var root = document.documentElement
    var rows = Math.max(1, Math.ceil(count / cols))
    var row = Math.max(MIN_ROW, Math.floor((grid.clientHeight - GAP * (rows - 1)) / rows))
    root.classList.toggle('short', row < STACK_ROW)
    root.style.setProperty('--btn', row + 'px')
    var art = row < STACK_ROW ? Math.max(22, Math.min(32, row - 12)) : Math.max(30, Math.min(72, Math.round(row * 0.42)))
    root.style.setProperty('--art', art + 'px')
    root.style.setProperty('--body', Math.max(13, Math.min(19, Math.round(row * 0.17))) + 'px')
  }

  function render() {
    document.documentElement.lang = Fremkit.locale
    var grid = document.getElementById('grid'), empty = document.getElementById('empty')
    if (openPath.length && !currentGroup()) openPath = []
    var list = view()
    // Rebuilding drops any pending icon retry with the node that owned it.
    for (var i = 0; i < grid.children.length; i++) clearTimeout(grid.children[i].retryTimer)
    grid.innerHTML = ''
    var cols = Math.max(1, Math.min(12, Math.round(Number(settings.columns)) || 4))
    grid.style.setProperty('--cols', cols)
    grid.hidden = list.length === 0
    empty.hidden = list.length > 0
    empty.textContent = Fremkit.t(L.empty)
    applyBackground()
    var inGroup = openPath.length > 0
    grid.classList.toggle('in-group', inGroup)
    applyRowSize(grid, inGroup ? buttons().length : list.length, cols)
    list.forEach(function (spec, position) { grid.appendChild(buttonFor(spec, position)) })
  }

  function applySize(next) {
    if (!next) return
    document.documentElement.classList.toggle('tight', next.h < 6)
    render()
  }

  Fremkit.whenReady(function () {
    document.documentElement.lang = Fremkit.locale
    Fremkit.onLocale(render)
    settings = Fremkit.settings || {}
    applySize(Fremkit.size)
    Fremkit.onResize(applySize)
    Fremkit.onSettings(function (next) { settings = next || {}; feedback = {}; render() })
    // Only used to turn an application name into the bundle id its icon is served under. The
    // Dock republishes whenever a badge moves, so the grid is rebuilt only when the bundle ids
    // the buttons resolve to actually changed — otherwise every icon would reload every second.
    var resolved = ''
    function rerenderIfResolutionChanged() {
      var next = resolution()
      if (next === resolved) return
      resolved = next
      render()
    }
    Fremkit.subscribe('dock', function (data) {
      dock = data
      rerenderIfResolutionChanged()
    })
    // Every installed application, not only the ones in the Dock: a button pointing at something
    // the user never docked still gets its real icon. Asked of the host, which can reach the
    // route: this frame is served with `connect-src 'none'`, so its own fetch goes nowhere.
    function loadInstalled() {
      Fremkit.installedApps()
        .then(function (list) {
          installed = Array.isArray(list) ? list : []
          rerenderIfResolutionChanged()
        })
        .catch(function () { /* the Dock match and the glyph still stand */ })
    }
    loadInstalled()
    setInterval(loadInstalled, INSTALLED_REFRESH_MS)
    render()
  })
</script></body></html>

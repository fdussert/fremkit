<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GitHub inbox</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:#e6e8eb;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
  .muted{color:#8b93a0}
  .note{font-size:13px;color:#8b93a0;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [hidden]{display:none!important}
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .muted,html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}

  .banner{flex:0 0 auto;font-size:12px;letter-spacing:.06em;color:#f0a020;background:rgba(240,160,32,.12);border-radius:8px;padding:4px 8px}
  .banner.bad{color:#d9463f;background:rgba(217,70,63,.12)}
  .head{flex:0 0 auto;display:flex;align-items:center;gap:10px}
  .head .counts{flex:1;font-size:12px;color:#8b93a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Finger-sized: the button is a touch target, not a link. */
  .head button{min-height:32px;padding:0 12px;border:0;border-radius:8px;font:inherit;font-size:13px;
    color:inherit;background:rgba(128,128,128,.16)}
  .head button:active{background:rgba(128,128,128,.32)}
  .scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:4px;padding-right:4px}
  .stale{opacity:.55}
  .sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8b93a0;margin:6px 2px 2px}
  /* One source unavailable is one line, not a blank tile. */
  .serr{font-size:12px;color:#8b93a0;padding:2px 8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.on-light .serr{color:var(--on-surface,#0b0d10);opacity:.7}
  .row{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 8px;border-radius:8px;
    background:rgba(128,128,128,.08)}
  .row:active{background:rgba(128,128,128,.22)}
  .row.done{opacity:.4}
  .glyph{flex:0 0 auto;width:22px;text-align:center;font-size:14px;font-weight:700;color:#8b93a0}
  .glyph.pr{color:#2fb36b}.glyph.issue{color:#8ab4f8}.glyph.release{color:#c08af0}
  .glyph.ci{color:#f0a020}.glyph.commit{color:#8b93a0}.glyph.discussion{color:#58b9c9}
  .glyph.draft{color:#5f6771}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;color:#8b93a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .when{flex:0 0 auto;font-size:11px;color:#8b93a0;font-variant-numeric:tabular-nums}

  html.compact .wrap{padding:0 calc(var(--h,80px) * .12);justify-content:center;gap:0}
  html.compact .head,html.compact .scroll,html.compact .banner{display:none!important}
  .cwrap{display:none;align-items:center;gap:calc(var(--h,80px) * .1)}
  html.compact .cwrap{display:flex}
  html.compact.slot-right .cwrap{justify-content:flex-end}
  .clabel{font-size:calc(var(--h,80px) * .18);letter-spacing:.08em;color:#8b93a0}
  .cnum{font-size:calc(var(--h,80px) * .34);font-weight:600;font-variant-numeric:tabular-nums}
  .cnum.rev{color:var(--accent,#d9b36a)}
  html.accent-fill .cnum.rev{color:var(--on-surface)}
</style></head>
<body><div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <div class="head" id="head"><span class="counts" id="counts"></span><button id="markAll" type="button"></button></div>
  <div class="scroll" id="scroll"></div>
  <div class="note" id="empty" hidden></div>
  <div class="cwrap" id="cwrap"><span class="clabel">GH</span><span class="cnum" id="cinbox">0</span><span class="cnum rev" id="creview">0</span></div>
</div>
<script>
  var L = {
    notifications: { fr: 'Notifications', en: 'Notifications' },
    reviews: { fr: 'Revues demandées', en: 'Review requests' },
    myPrs: { fr: 'Mes pull requests', en: 'My pull requests' },
    markAll: { fr: 'Tout marquer lu', en: 'Mark all read' },
    counts: { fr: '{n} non lues · {r} revues', en: '{n} unread · {r} reviews' },
    countsReviews: { fr: '{r} revues', en: '{r} reviews' },
    agoSeconds: { fr: 'il y a {n} s', en: '{n} s ago' },
    agoMinutes: { fr: 'il y a {n} min', en: '{n} min ago' },
    agoHours: { fr: 'il y a {n} h', en: '{n} h ago' },
    agoDays: { fr: 'il y a {n} j', en: '{n} d ago' },
    draft: { fr: 'brouillon', en: 'draft' },
    noConnection: { fr: 'Connexion manquante', en: 'No connection' },
    loading: { fr: 'Chargement…', en: 'Loading…' },
    unauthorized: { fr: 'Jeton refusé', en: 'Token refused' },
    rateLimited: { fr: 'Quota GitHub épuisé', en: 'GitHub quota exhausted' },
    unconfigured: { fr: 'Connexion incomplète', en: 'Connection incomplete' },
    offline: { fr: 'Hors ligne', en: 'Offline' },
    empty: { fr: 'Rien à lire', en: 'Nothing to read' },
    /* One source of the snapshot is unavailable — the others keep drawing. */
    errFineGrained: { fr: 'Notifications : jeton classique requis', en: 'Notifications need a classic token' },
    errForbidden: { fr: 'Pas d’accès', en: 'No access' },
    errNotFound: { fr: 'Dépôt introuvable ou inaccessible à ce jeton', en: 'Repository not found or not accessible by this token' },
    errRateLimited: { fr: 'Quota atteint', en: 'Rate limited' },
    errOffline: { fr: 'Hors ligne', en: 'Offline' },
    reason_assign: { fr: 'assigné', en: 'assigned' },
    reason_author: { fr: 'auteur', en: 'author' },
    reason_comment: { fr: 'commentaire', en: 'comment' },
    reason_mention: { fr: 'mention', en: 'mention' },
    reason_review_requested: { fr: 'revue demandée', en: 'review requested' },
    reason_state_change: { fr: 'état modifié', en: 'state changed' },
    reason_subscribed: { fr: 'abonnement', en: 'subscribed' },
    reason_team_mention: { fr: 'équipe mentionnée', en: 'team mentioned' },
    reason_ci_activity: { fr: 'CI', en: 'CI' }
  }
  /* A glyph rather than an icon font: a widget takes no runtime dependency. */
  var GLYPH = { pr: '⑃', issue: '◉', release: '⬢', ci: '⟳', commit: '◆', discussion: '💬', other: '•' }
  var ERRORS = { unauthorized: L.unauthorized, 'rate-limited': L.rateLimited, unconfigured: L.unconfigured, offline: L.offline }
  var SECTION_ERRORS = {
    'fine-grained-token': L.errFineGrained, forbidden: L.errForbidden, 'not-found': L.errNotFound,
    unauthorized: L.unauthorized, 'rate-limited': L.errRateLimited, offline: L.errOffline
  }

  var snapshot = null, channel = null, unsub = null
  var show = { notifications: true, reviews: true, myPrs: false }, maxRows = 12
  /* Ids the user has just tapped: drawn as read before the next poll confirms it. */
  var pending = Object.create(null)

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return Fremkit.t(L.agoSeconds, { n: s })
    var m = Math.floor(s / 60)
    if (m < 60) return Fremkit.t(L.agoMinutes, { n: m })
    var h = Math.floor(m / 60)
    if (h < 24) return Fremkit.t(L.agoHours, { n: h })
    return Fremkit.t(L.agoDays, { n: Math.floor(h / 24) })
  }
  function reason(key) {
    var entry = L['reason_' + String(key || '').replace(/[^a-z_]/g, '')]
    return entry ? Fremkit.t(entry) : String(key || '')
  }
  function section(label) { return '<div class="sect">' + Fremkit.esc(Fremkit.t(label)) + '</div>' }
  function sectionError(code) {
    var entry = SECTION_ERRORS[code] || L.errOffline
    return '<div class="serr">' + Fremkit.esc(Fremkit.t(entry)) + '</div>'
  }
  function sectionErrors() { return (snapshot && snapshot.errors) || {} }
  function notificationRow(n, now) {
    return '<div class="row' + (pending[n.id] ? ' done' : '') + '" data-id="' + Fremkit.esc(n.id) + '" data-url="' + Fremkit.esc(n.url) + '">' +
      '<span class="glyph ' + Fremkit.esc(n.type) + '">' + (GLYPH[n.type] || GLYPH.other) + '</span>' +
      '<span class="body"><span class="title">' + Fremkit.esc(n.title) + '</span>' +
      '<span class="sub">' + Fremkit.esc(n.repo) + ' · ' + Fremkit.esc(reason(n.reason)) + '</span></span>' +
      '<span class="when">' + Fremkit.esc(ago(now - n.updatedAt)) + '</span></div>'
  }
  function pullRow(p, now) {
    return '<div class="row" data-url="' + Fremkit.esc(p.url) + '">' +
      '<span class="glyph ' + (p.draft ? 'draft' : 'pr') + '">' + GLYPH.pr + '</span>' +
      '<span class="body"><span class="title">' + Fremkit.esc(p.title) + '</span>' +
      '<span class="sub">' + Fremkit.esc(p.repo) + ' #' + Fremkit.esc(p.number) + ' · ' + Fremkit.esc(p.author) +
      (p.draft ? ' · ' + Fremkit.esc(Fremkit.t(L.draft)) : '') + '</span></span>' +
      '<span class="when">' + Fremkit.esc(ago(now - p.updatedAt)) + '</span></div>'
  }

  function renderCompact() {
    var unread = snapshot ? (snapshot.notifications || []).filter(function (n) { return !pending[n.id] }).length : 0
    var reviews = snapshot ? (snapshot.reviewRequests || []).length : 0
    // A number the connection cannot know is worse than no number: show only what is available.
    var noInbox = !!sectionErrors().notifications
    document.getElementById('cinbox').hidden = noInbox
    document.getElementById('cinbox').textContent = unread
    document.getElementById('creview').hidden = !!sectionErrors().reviews
    document.getElementById('creview').textContent = reviews
  }

  function render() {
    if (Fremkit.compact) { renderCompact(); return }
    var banner = document.getElementById('banner'), scroll = document.getElementById('scroll')
    var empty = document.getElementById('empty'), head = document.getElementById('head')
    if (!channel) {
      banner.hidden = false; banner.className = 'banner bad'; banner.textContent = Fremkit.t(L.noConnection)
      scroll.hidden = true; head.hidden = true; empty.hidden = true; return
    }
    if (!snapshot) {
      banner.hidden = true; scroll.hidden = true; head.hidden = true
      empty.hidden = false; empty.textContent = Fremkit.t(L.loading); return
    }
    head.hidden = false
    scroll.hidden = false
    var err = snapshot.error
    banner.hidden = !err
    if (err) {
      banner.className = 'banner' + (err === 'unauthorized' || err === 'unconfigured' ? ' bad' : '')
      banner.textContent = Fremkit.t(ERRORS[err] || L.offline)
    }
    scroll.classList.toggle('stale', !!err)

    var now = Date.now()
    var errs = sectionErrors()
    var notifications = (snapshot.notifications || []).filter(function (n) { return !pending[n.id] })
    var reviews = snapshot.reviewRequests || [], mine = snapshot.myPrs || []
    // A count for a source that could not be read would be a lie; drop it from the line instead.
    document.getElementById('counts').textContent = errs.notifications
      ? (errs.reviews ? '' : Fremkit.t(L.countsReviews, { r: reviews.length }))
      : Fremkit.t(L.counts, { n: notifications.length, r: reviews.length })
    document.getElementById('markAll').textContent = Fremkit.t(L.markAll)
    document.getElementById('markAll').hidden = !!errs.notifications
    document.getElementById('markAll').disabled = notifications.length === 0

    var html = '', drawn = 0, noted = 0
    function take(list) { var slice = list.slice(0, Math.max(0, maxRows - drawn)); drawn += slice.length; return slice }
    /* A failed source shows its header and one line, so the tile says which half is missing. */
    function part(label, key, list, row) {
      if (errs[key]) { html += section(label) + sectionError(errs[key]); noted++; return }
      var rows = take(list)
      if (rows.length) html += section(label) + rows.map(row).join('')
    }
    if (show.notifications) part(L.notifications, 'notifications', notifications, function (n) { return notificationRow(n, now) })
    if (show.reviews) part(L.reviews, 'reviews', reviews, function (p) { return pullRow(p, now) })
    if (show.myPrs) part(L.myPrs, 'myPrs', mine, function (p) { return pullRow(p, now) })
    scroll.innerHTML = html
    empty.hidden = drawn > 0 || noted > 0
    empty.textContent = Fremkit.t(L.empty)
  }

  function markRead(id) {
    if (!channel || !id || pending[id]) return
    // Optimistic: the row greys out at once and the next poll confirms it. A refusal puts it back.
    pending[id] = true
    render()
    var result = Fremkit.sendCommand(channel, 'markRead', { id: id })
    if (result && typeof result.catch === 'function') {
      result.catch(function (err) { delete pending[id]; render(); console.error('markRead failed', err) })
    }
  }

  function applySettings(s) {
    show = {
      notifications: s.showNotifications !== false,
      reviews: s.showReviews !== false,
      myPrs: s.showMyPrs === true
    }
    maxRows = Number(s.max) > 0 ? Number(s.max) : 12
    var next = s.connection ? 'github:' + s.connection : null
    if (next !== channel) {
      if (unsub) { unsub(); unsub = null }
      // Another account's inbox is not this one's, so nothing is carried over.
      snapshot = null
      pending = Object.create(null)
      channel = next
      if (channel) unsub = Fremkit.subscribe(channel, function (d) { snapshot = d; render() })
    }
    render()
  }

  Fremkit.whenReady(function () {
    document.documentElement.lang = Fremkit.locale
    document.documentElement.style.setProperty('--h', Fremkit.size.px.height + 'px')
    Fremkit.onResize(function (size) { document.documentElement.style.setProperty('--h', size.px.height + 'px'); render() })
    Fremkit.onLocale(function (locale) { document.documentElement.lang = locale; render() })
    applySettings(Fremkit.settings)
    Fremkit.onSettings(function (next) { applySettings(next || {}) })

    document.getElementById('scroll').addEventListener('click', function (e) {
      var row = e.target.closest('.row')
      if (!row) return
      if (row.getAttribute('data-id')) markRead(row.getAttribute('data-id'))
    })
    document.getElementById('markAll').addEventListener('click', function () {
      if (!channel || !snapshot) return
      (snapshot.notifications || []).forEach(function (n) { pending[n.id] = true })
      render()
      var result = Fremkit.sendCommand(channel, 'markAllRead', {})
      if (result && typeof result.catch === 'function') {
        result.catch(function (err) { pending = Object.create(null); render(); console.error('markAllRead failed', err) })
      }
    })
    setInterval(render, 30000)
  })
</script></body></html>

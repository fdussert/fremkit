<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GitHub Actions</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [hidden]{display:none!important}
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}

  .banner{flex:0 0 auto;font-size:calc(12px * var(--text-scale, 1));letter-spacing:.06em;color:#f0a020;background:rgba(240,160,32,.12);border-radius:8px;padding:4px 8px}
  .banner.bad{color:var(--danger, #d9463f);background:rgba(217,70,63,.12)}
  .scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:6px;padding-right:4px}
  .stale{opacity:.55}
  /* Finger-sized rows, running and finished alike: 40 px is the touch minimum. */
  .row{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border-radius:10px;
    background:rgba(128,128,128,.08)}
  .row.live{background:var(--surface-2, #1a1e24)}
  html.on-light .row.live{background:rgba(128,128,128,.18)}
  .dot{flex:0 0 auto;width:11px;height:11px;border-radius:6px;background:var(--text-dim, #5f6771)}
  .dot.success{background:var(--ok, #2fb36b)}.dot.failure{background:var(--danger, #d9463f)}.dot.cancelled{background:var(--text-dim, #5f6771)}
  .dot.timed_out{background:var(--danger, #d9463f)}.dot.action_required{background:#f0a020}.dot.neutral{background:var(--text-muted, #8b93a0)}
  .dot.skipped{background:repeating-linear-gradient(135deg,var(--border-strong, #3a404a) 0 4px,var(--surface-3, #252a32) 4px 8px)}
  .dot.queued{background:var(--text-muted, #8b93a0)}
  .dot.running{background:var(--accent,#d9b36a);animation:pulse 1.1s ease-in-out infinite alternate}
  @keyframes pulse{from{opacity:.35}to{opacity:1}}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .title{font-size:calc(14px * var(--text-scale, 1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:calc(11px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.on-light .sub{color:var(--on-surface,#0b0d10);opacity:.7}
  .when{flex:0 0 auto;font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);font-variant-numeric:tabular-nums}
  html.on-light .when{color:var(--on-surface,#0b0d10);opacity:.7}
</style></head>
<body><div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <div class="scroll" id="scroll"></div>
  <div class="note" id="empty" hidden></div>
</div>
<script>
  var L = {
    agoSeconds: { fr: 'il y a {n} s', en: '{n} s ago' },
    agoMinutes: { fr: 'il y a {n} min', en: '{n} min ago' },
    agoHours: { fr: 'il y a {n} h', en: '{n} h ago' },
    agoDays: { fr: 'il y a {n} j', en: '{n} d ago' },
    elapsedMinutes: { fr: '{m} min {s} s', en: '{m} min {s} s' },
    elapsedSeconds: { fr: '{s} s', en: '{s} s' },
    queued: { fr: 'en file', en: 'queued' },
    noConnection: { fr: 'Connexion manquante', en: 'No connection' },
    loading: { fr: 'Chargement…', en: 'Loading…' },
    unauthorized: { fr: 'Jeton refusé', en: 'Token refused' },
    rateLimited: { fr: 'Quota GitHub épuisé', en: 'GitHub quota exhausted' },
    unconfigured: { fr: 'Connexion incomplète', en: 'Connection incomplete' },
    offline: { fr: 'Hors ligne', en: 'Offline' },
    /* The runs source alone failed: the rest of the snapshot is fine, this line says why. */
    errForbidden: { fr: 'Pas d’accès aux dépôts avec ce jeton', en: 'No access to the repositories with this token' },
    errNotFound: { fr: 'Dépôt introuvable ou inaccessible à ce jeton', en: 'Repository not found or not accessible by this token' },
    errRateLimited: { fr: 'Quota atteint', en: 'Rate limited' },
    empty: { fr: 'Aucun run récent', en: 'No recent run' },
    noRepos: { fr: 'Aucun dépôt : renseignez « Dépôts » sur la connexion', en: 'No repository: fill in “Repositories” on the connection' }
  }
  var ERRORS = { unauthorized: L.unauthorized, 'rate-limited': L.rateLimited, unconfigured: L.unconfigured, offline: L.offline }
  var RUNS_ERRORS = { forbidden: L.errForbidden, 'not-found': L.errNotFound, 'rate-limited': L.errRateLimited, unauthorized: L.unauthorized, offline: L.offline }

  var snapshot = null, channel = null, unsub = null, repos = [], runningMax = 4, historyMax = 8

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return Fremkit.t(L.agoSeconds, { n: s })
    var m = Math.floor(s / 60)
    if (m < 60) return Fremkit.t(L.agoMinutes, { n: m })
    var h = Math.floor(m / 60)
    if (h < 24) return Fremkit.t(L.agoHours, { n: h })
    return Fremkit.t(L.agoDays, { n: Math.floor(h / 24) })
  }
  function elapsed(ms) {
    var s = Math.max(0, Math.round(ms / 1000)), m = Math.floor(s / 60)
    return m ? Fremkit.t(L.elapsedMinutes, { m: m, s: String(s % 60).padStart(2, '0') }) : Fremkit.t(L.elapsedSeconds, { s: s })
  }
  /* An empty repository list means "every repository the connection reads", not "none". */
  function selected(run) { return !repos.length || repos.indexOf(run.repo) !== -1 }

  function row(run, now, live) {
    var cls = live ? (run.status === 'queued' ? 'queued' : 'running') : (run.conclusion || '')
    var right = live
      ? (run.status === 'queued' ? Fremkit.t(L.queued) : elapsed(now - (run.startedAt || now)))
      : ago(now - (run.updatedAt || run.startedAt || now))
    return '<div class="row' + (live ? ' live' : '') + '">' +
      '<i class="dot ' + Fremkit.esc(cls) + '"></i>' +
      '<span class="body"><span class="title">' + Fremkit.esc(run.name) + '</span>' +
      '<span class="sub">' + Fremkit.esc(run.repo) + ' · ' + Fremkit.esc(run.branch) +
      (run.actor ? ' · ' + Fremkit.esc(run.actor) : '') + (run.event ? ' · ' + Fremkit.esc(run.event) : '') + '</span></span>' +
      '<span class="when">' + Fremkit.esc(right) + '</span></div>'
  }

  function render() {
    var banner = document.getElementById('banner'), scroll = document.getElementById('scroll'), empty = document.getElementById('empty')
    if (!channel) {
      banner.hidden = false; banner.className = 'banner bad'; banner.textContent = Fremkit.t(L.noConnection)
      scroll.hidden = true; empty.hidden = true; return
    }
    if (!snapshot) {
      banner.hidden = true; scroll.hidden = true; empty.hidden = false; empty.textContent = Fremkit.t(L.loading); return
    }
    scroll.hidden = false
    var err = snapshot.error
    var runsErr = !err && snapshot.errors && snapshot.errors.runs
    banner.hidden = !err && !runsErr
    if (err) {
      banner.className = 'banner' + (err === 'unauthorized' || err === 'unconfigured' ? ' bad' : '')
      banner.textContent = Fremkit.t(ERRORS[err] || L.offline)
    } else if (runsErr) {
      banner.className = 'banner' + (runsErr === 'not-found' || runsErr === 'forbidden' ? ' bad' : '')
      banner.textContent = Fremkit.t(RUNS_ERRORS[runsErr] || L.offline)
    }
    scroll.classList.toggle('stale', !!err)

    var now = Date.now()
    var all = (snapshot.runs || []).filter(selected)
    var live = all.filter(function (r) { return r.status !== 'completed' }).slice(0, runningMax)
    var done = all.filter(function (r) { return r.status === 'completed' }).slice(0, historyMax)
    scroll.innerHTML =
      live.map(function (r) { return row(r, now, true) }).join('') +
      done.map(function (r) { return row(r, now, false) }).join('')
    empty.hidden = live.length + done.length > 0
    // An empty snapshot with nothing configured on the connection deserves a clearer line.
    empty.textContent = Fremkit.t((snapshot.runs || []).length ? L.empty : L.noRepos)
  }

  function applySettings(s) {
    repos = Array.isArray(s.repos) ? s.repos.slice() : []
    runningMax = Number(s.max) > 0 ? Number(s.max) : 4
    historyMax = Number(s.history) > 0 ? Number(s.history) : 8
    var next = s.connection ? 'github:' + s.connection : null
    if (next !== channel) {
      if (unsub) { unsub(); unsub = null }
      snapshot = null
      channel = next
      if (channel) unsub = Fremkit.subscribe(channel, function (d) { snapshot = d; render() })
    }
    render()
  }

  Fremkit.whenReady(function () {
    document.documentElement.lang = Fremkit.locale
    Fremkit.onLocale(function (locale) { document.documentElement.lang = locale; render() })
    applySettings(Fremkit.settings)
    Fremkit.onSettings(function (next) { applySettings(next || {}) })
    setInterval(render, 1000)
  })
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pipelines Azure DevOps</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:14px 18px;position:relative;display:flex;flex-direction:column;gap:6px}
  .muted{color:var(--text-muted, #8b93a0)}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [hidden]{display:none!important}
  /* The host says which way round the tile is: on-light means dark text on a light body. */
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .muted,html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}
</style>
<style>
  .banner{flex:0 0 auto;font-size:calc(12px * var(--text-scale, 1));letter-spacing:.06em;color:#f0a020;background:rgba(240,160,32,.12);border-radius:8px;padding:4px 8px}
  .banner.bad{color:var(--danger, #d9463f);background:rgba(217,70,63,.12)}
  .scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding-right:4px}
  .stale{opacity:.55}
  .run{background:var(--surface-2, #1a1e24);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .run .top{display:flex;align-items:baseline;gap:8px}
  .run .name{font-size:calc(17px * var(--text-scale, 1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .run .meta{font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .run .time{font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);font-variant-numeric:tabular-nums}
  .chain{display:flex;gap:4px}
  .seg{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .seg>i{display:block;height:6px;border-radius:3px;background:var(--border-strong, #3a404a)}
  .seg.running>i{background:var(--accent, #d9b36a);animation:pulse 1.1s ease-in-out infinite alternate}
  .seg.succeeded>i{background:var(--ok, #2fb36b)}
  .seg.failed>i{background:var(--danger, #d9463f)}
  .seg.partial>i{background:#f0a020}
  .seg.canceled>i{background:var(--text-dim, #5f6771)}
  .seg.skipped>i{background:repeating-linear-gradient(135deg,var(--border-strong, #3a404a) 0 4px,var(--surface-3, #252a32) 4px 8px)}
  .seg>span{font-size:calc(11px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes pulse{from{opacity:.45}to{opacity:1}}
  .hist{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
  /* Finger-sized rows: the whole line is the tap target that opens the run. */
  .line{display:flex;align-items:center;gap:10px;font-size:calc(14px * var(--text-scale, 1));min-height:40px;padding:6px 8px;border-radius:8px;background:rgba(128,128,128,.08)}
  .line:active{background:var(--surface-3, #252a32)}
  .dot{width:11px;height:11px;border-radius:6px;flex:0 0 auto;background:var(--text-dim, #5f6771)}
  .dot.succeeded{background:var(--ok, #2fb36b)}.dot.failed{background:var(--danger, #d9463f)}.dot.partial{background:#f0a020}
  .line .p{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
  .line .b{color:var(--text-muted, #8b93a0);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line .d{color:var(--text-muted, #8b93a0);font-variant-numeric:tabular-nums}
</style></head>
<body><div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <div class="scroll" id="scroll"><div id="running"></div><div class="hist" id="hist"></div></div>
  <div class="note" id="empty" hidden></div>
</div>
<script>
  var L = {
    succeeded: { fr: 'réussi', en: 'succeeded' },
    failed: { fr: 'échec', en: 'failed' },
    canceled: { fr: 'annulé', en: 'canceled' },
    partial: { fr: 'avertissements', en: 'warnings' },
    agoSeconds: { fr: 'il y a {n} s', en: '{n} s ago' },
    agoMinutes: { fr: 'il y a {n} min', en: '{n} min ago' },
    agoHours: { fr: 'il y a {h} h {m} min', en: '{h} h {m} min ago' },
    elapsedMinutes: { fr: '{m} min {s} s', en: '{m} min {s} s' },
    elapsedSeconds: { fr: '{s} s', en: '{s} s' },
    stagesPending: { fr: 'Étapes en attente…', en: 'Waiting for stages…' },
    noConnection: { fr: 'Connexion manquante', en: 'No connection' },
    loading: { fr: 'Chargement…', en: 'Loading…' },
    unauthorized: { fr: 'Connexion refusée', en: 'Connection refused' },
    offline: { fr: 'Hors ligne', en: 'Offline' },
    empty: { fr: 'Aucun run récent', en: 'No recent run' }
  }
  var RESULT_LABEL = { succeeded: L.succeeded, failed: L.failed, canceled: L.canceled, partial: L.partial }
  var snapshot = null, channel = null, unsub = null, historyMax = 8, branchFilter = ''

  function matchesFilter(run) {
    if (!branchFilter) return true
    return String(run.branch || '').toLowerCase().indexOf(branchFilter) === 0
  }

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return Fremkit.t(L.agoSeconds, { n: s })
    var m = Math.floor(s / 60)
    if (m < 60) return Fremkit.t(L.agoMinutes, { n: m })
    return Fremkit.t(L.agoHours, { h: Math.floor(m / 60), m: m % 60 })
  }
  function elapsed(ms) {
    var s = Math.max(0, Math.round(ms / 1000)), m = Math.floor(s / 60)
    return m ? Fremkit.t(L.elapsedMinutes, { m: m, s: String(s % 60).padStart(2, '0') }) : Fremkit.t(L.elapsedSeconds, { s: s })
  }
  function segClass(stage) {
    if (stage.state === 'running') return 'running'
    if (stage.state === 'pending') return 'pending'
    return stage.result || 'succeeded'
  }
  function runCard(run, now) {
    var since = run.startedAt || run.queuedAt
    var chain = run.stages.map(function (s) {
      return '<span class="seg ' + segClass(s) + '"><i></i><span>' + Fremkit.esc(s.name) + '</span></span>'
    }).join('')
    return '<div class="run" data-url="' + Fremkit.esc(run.url) + '">' +
      '<div class="top"><span class="name">' + Fremkit.esc(run.pipeline) + '</span>' +
      '<span class="meta">' + Fremkit.esc(run.branch) + (run.requestedFor ? ' · ' + Fremkit.esc(run.requestedFor) : '') + '</span>' +
      '<span class="time">' + elapsed(now - since) + '</span></div>' +
      (chain ? '<div class="chain">' + chain + '</div>' : '<div class="note">' + Fremkit.esc(Fremkit.t(L.stagesPending)) + '</div>') +
      '</div>'
  }
  function histLine(run, now) {
    var end = run.finishedAt || run.queuedAt
    var dur = run.finishedAt && run.startedAt ? elapsed(run.finishedAt - run.startedAt) : '—'
    return '<div class="line" data-url="' + Fremkit.esc(run.url) + '" title="' + Fremkit.esc(RESULT_LABEL[run.result] ? Fremkit.t(RESULT_LABEL[run.result]) : '') + '">' +
      '<i class="dot ' + Fremkit.esc(run.result || '') + '"></i>' +
      '<span class="p">' + Fremkit.esc(run.pipeline) + '</span>' +
      '<span class="b">' + Fremkit.esc(run.branch) + '</span>' +
      '<span class="d">' + dur + ' · ' + ago(now - end) + '</span></div>'
  }
  function render() {
    var banner = document.getElementById('banner'), scroll = document.getElementById('scroll'), empty = document.getElementById('empty')
    if (!channel) { banner.hidden = false; banner.className = 'banner bad'; banner.textContent = Fremkit.t(L.noConnection); scroll.hidden = true; empty.hidden = true; return }
    if (!snapshot) { banner.hidden = true; scroll.hidden = true; empty.hidden = false; empty.textContent = Fremkit.t(L.loading); return }
    scroll.hidden = false
    var err = snapshot.error
    banner.hidden = !err
    if (err) {
      banner.className = 'banner' + (err === 'unauthorized' ? ' bad' : '')
      banner.textContent = Fremkit.t(err === 'unauthorized' ? L.unauthorized : L.offline)
    }
    scroll.classList.toggle('stale', !!err)
    var now = Date.now()
    var running = (snapshot.running || []).filter(matchesFilter), history = (snapshot.history || []).filter(matchesFilter)
    var active = running.filter(function (r) { return r.status === 'running' }).length
    var lines = Math.max(2, historyMax - 2 * active)
    document.getElementById('running').innerHTML = running.map(function (r) { return runCard(r, now) }).join('')
    document.getElementById('hist').innerHTML = history.slice(0, lines).map(function (r) { return histLine(r, now) }).join('')
    empty.hidden = running.length + history.length > 0
    empty.textContent = Fremkit.t(L.empty)
  }

  /**
   * Applies the settings, live. Only a change of connection touches the subscription: the
   * history length and the branch filter are applied at render time, so they need no resubscribe.
   */
  function applySettings(s) {
    historyMax = Number(s.history) || 8
    branchFilter = String(s.branchFilter || '').trim().toLowerCase()
    var next = s.connection ? 'azure-devops:' + s.connection : null
    if (next !== channel) {
      if (unsub) { unsub(); unsub = null }
      // The old connection's runs are not this one's, so nothing is kept from it.
      snapshot = null
      channel = next
      if (channel) unsub = Fremkit.subscribe(channel, function (d) { snapshot = d; render() })
    }
    render()
  }

  Fremkit.whenReady(function () {
    document.documentElement.lang = Fremkit.locale
    Fremkit.onLocale(function (locale) { document.documentElement.lang = locale; render() })
    applySettings(Fremkit.settings)
    // Live preview and a connection picked after the widget was placed, without a reload.
    Fremkit.onSettings(function (next) { applySettings(next || {}) })
    document.getElementById('scroll').addEventListener('click', function (e) {
      var target = e.target.closest('[data-url]')
      if (!target || !target.getAttribute('data-url') || !channel) return
      var result = Fremkit.sendCommand(channel, 'open', { url: target.getAttribute('data-url') })
      // The server refuses to open a page for a client that is not on the Mac; a refusal must
      // not surface as an unhandled rejection.
      if (result && typeof result.catch === 'function') result.catch(function (err) { console.error('open failed', err) })
    })
    setInterval(render, 1000)
  })
</script></body></html>

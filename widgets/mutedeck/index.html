<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MuteDeck</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:14px 18px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .big{font-size:calc(44px * var(--text-scale, 1));font-weight:600;line-height:1}
  .bar{height:8px;border-radius:4px;background:var(--surface-3, #252a32);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent, #d9b36a);width:0;transition:width .4s}
  .row{display:flex;justify-content:space-between;font-size:calc(15px * var(--text-scale, 1))}
  .muted{color:var(--text-muted, #8b93a0)}
  button{font:inherit;border:0;border-radius:10px;background:var(--surface-3, #252a32);color:var(--text, #e6e8eb);padding:10px 14px;font-size:calc(18px * var(--text-scale, 1))}
  button:active{background:var(--accent, #d9b36a)}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* The host says which way round the tile is: on-light means dark text on a light body. */
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .muted,html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}
  /* A bar painted in the accent vanishes when the body *is* the accent, so it flips to the text colour. */
  html.on-light .bar,html.accent-fill .bar{background:rgba(128,128,128,.35)}
  html.accent-fill .bar>i{background:var(--on-surface,#0b0d10)}
</style></head><body><div class="wrap"><div class="note" id="st"></div>
<div class="btns" id="btns" style="display:flex;gap:10px;flex:1;align-items:stretch"></div></div>
<style>
  .btns button{flex:1;min-height:44px;font-size:calc(clamp(18px,6vh,30px) * var(--text-scale, 1));line-height:1;padding:8px 0;border-radius:12px}
  .btns button.on{background:#b3261e}
  .btns button.off{opacity:.4}
  .btns button.leave{background:#5a2323;font-size:calc(clamp(14px,4vh,22px) * var(--text-scale, 1))}
  .btns button.leave.on{background:#8b1e1e}
</style>
<script>
  var L = {
    leave: { fr: 'Quitter', en: 'Leave' },
    error: { fr: 'erreur MuteDeck', en: 'MuteDeck error' },
    missing: { fr: 'MuteDeck absent', en: 'MuteDeck not running' },
    inCall: { fr: 'en cours', en: 'in a call' },
    noCall: { fr: 'aucune', en: 'no call' },
    mute: { fr: 'Micro', en: 'Mute' }, video: { fr: 'Caméra', en: 'Video' },
    share: { fr: 'Partage d’écran', en: 'Screen share' }, record: { fr: 'Enregistrement', en: 'Record' }
  }
  /* Every button MuteDeck's local API can drive; the settings pick which ones the tile shows. */
  var BUTTONS = [
    { id: 'mute', setting: 'showMute', icon: '🎤', command: 'toggleMute', on: function (d) { return d.mute === 'active' }, field: 'mute' },
    { id: 'video', setting: 'showVideo', icon: '📷', command: 'toggleVideo', on: function (d) { return d.video === 'inactive' }, field: 'video' },
    { id: 'share', setting: 'showShare', icon: '🖥', command: 'toggleShare', on: function (d) { return d.share === 'active' }, field: 'share' },
    { id: 'record', setting: 'showRecord', icon: '⏺', command: 'toggleRecord', on: function (d) { return d.record === 'active' }, field: 'record' },
    { id: 'leave', setting: 'showLeave', icon: null, command: 'leave', on: function (d) { return d.call === 'active' }, field: 'call' }
  ]
  Fremkit.whenReady(function () {
    var last = null, nodes = {}
    function build() {
      var box = document.getElementById('btns'); box.innerHTML = ''; nodes = {}
      BUTTONS.forEach(function (b) {
        if (Fremkit.settings[b.setting] === false) return
        var el = document.createElement('button')
        el.className = b.id
        el.title = Fremkit.t(L[b.id] || L.leave)
        el.onclick = function () { Fremkit.sendCommand('mutedeck', b.command).catch(function () {}) }
        box.appendChild(el); nodes[b.id] = el
      })
    }
    function render() {
      var st = document.getElementById('st')
      document.documentElement.lang = Fremkit.locale
      BUTTONS.forEach(function (b) {
        var el = nodes[b.id]; if (!el) return
        el.textContent = b.icon || Fremkit.t(L.leave)
        el.title = Fremkit.t(L[b.id] || L.leave)
        // 'disabled' means the running meeting app cannot do it: keep the button, dim it.
        var value = last && last.available ? last[b.field] : undefined
        el.classList.toggle('on', !!(last && last.available && b.on(last)))
        el.classList.toggle('off', value === 'disabled')
      })
      if (!last) return
      if (last.error) { st.textContent = Fremkit.t(L.error); return }
      if (!last.available) { st.textContent = Fremkit.t(L.missing); return }
      st.textContent = Fremkit.t(last.call === 'active' ? L.inCall : L.noCall)
    }
    build(); render()
    Fremkit.onSettings(function () { build(); render() })
    Fremkit.onLocale(render)
    Fremkit.subscribe('mutedeck', function (d) { last = d; render() })
  })
</script></body></html>

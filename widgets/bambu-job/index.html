<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Impression Bambu</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:14px 18px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .big{font-size:calc(44px * var(--text-scale, 1));font-weight:600;line-height:1}
  .bar{height:8px;border-radius:4px;background:var(--surface-3, #252a32);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent, #d9b36a);width:0;transition:width .4s}
  .row{display:flex;justify-content:space-between;font-size:calc(15px * var(--text-scale, 1))}
  .muted{color:var(--text-muted, #8b93a0)}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [hidden]{display:none!important}
  /* The host says which way round the tile is: on-light means dark text on a light body. */
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .muted,html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}
  /* A bar painted in the accent vanishes when the body *is* the accent, so it flips to the text colour. */
  html.on-light .bar,html.accent-fill .bar{background:rgba(128,128,128,.35)}
  html.accent-fill .bar>i{background:var(--on-surface,#0b0d10)}
</style>
<style>
  .file{font-size:calc(18px * var(--text-scale, 1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pct{font-size:calc(34px * var(--text-scale, 1));font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .head{display:flex;align-items:baseline;gap:10px}
  .head .pct{margin-left:auto}
  .bar.paused>i{background:#f0a020}
  .bar.failed>i{background:var(--danger, #d9463f)}
  .bar.finished>i{background:var(--ok, #2fb36b)}
  .err{color:var(--danger, #d9463f);font-size:calc(14px * var(--text-scale, 1))}
  .offline{opacity:.5}
  /* One row per AMS: a small label, then that unit's slots. Rows wrap on a narrow tile, and the
     whole block scrolls rather than pushing the job off the tile when there are many units. */
  .ams{display:flex;flex-direction:column;gap:4px;margin-top:2px;min-height:0;overflow:hidden}
  .unit{display:flex;align-items:center;gap:6px;min-width:0}
  .unitlabel{flex:0 0 auto;font-size:calc(10px * var(--text-scale, 1));line-height:1.1;color:var(--text-muted, #8b93a0);white-space:nowrap;min-width:34px}
  .unitlabel b{display:block;font-size:calc(11px * var(--text-scale, 1));font-weight:600;color:var(--text, #e6e8eb)}
  html.on-light .unitlabel b{color:var(--on-surface,#0b0d10)}
  .slots{flex:1;display:flex;gap:6px;min-width:0}
  .tray{flex:1;min-width:0;height:22px;border-radius:6px;background:var(--surface-3, #252a32);border:1px solid var(--border-strong, #3a404a);position:relative;overflow:hidden}
  .tray.active{border-color:var(--accent,#d9b36a);box-shadow:0 0 0 1px var(--accent,#d9b36a)}
  .tray>i{position:absolute;left:0;right:0;bottom:0;display:block}
  .tray>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(10px * var(--text-scale, 1));color:var(--text, #e6e8eb);text-shadow:0 1px 2px rgba(0,0,0,.6)}
  /* A single-slot unit (AMS HT, the external spool) must not stretch to a whole row's width. */
  .slots.one .tray{flex:0 0 auto;width:46px}
  /* Below 12 cells the tile is short as well as narrow: drop the per-unit labels to one letter. */
  @media (max-height:220px){ .tray{height:16px} .unitlabel{min-width:26px} }
  /* The iframe's own viewport is exactly the tile, so vw/vh track the tile size directly. */
  .wrap{flex-direction:row;align-items:center;gap:14px}
  .stats{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
  /* A fixed 4:3 box: the picture is cropped to it, never the other way round, so a frame of any
     size leaves the stats exactly where they were. Capped so it cannot outgrow the tile's height. */
  .cam{flex:0 0 auto;position:relative;width:min(40vw,calc((100vh - 28px) * 4 / 3),320px);aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface, #14171c)}
  .cam img{display:block;width:100%;height:100%;object-fit:cover}
  .cam img.off{visibility:hidden}
  .camoff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 8px;text-align:center;font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);background:var(--surface, #14171c)}
  /* Below 12 cells (480px) there is no room for a picture beside the job: put it on top instead. */
  @media (max-width:480px){
    .wrap{flex-direction:column;align-items:stretch;gap:8px;justify-content:center}
    .cam{align-self:center;width:min(100%,calc(45vh * 4 / 3))}
  }
</style></head>
<body><div class="wrap" id="wrap">
  <div class="cam" id="cam" hidden>
    <img id="shot" class="off" alt="">
    <span class="camoff" id="camoff"></span>
  </div>
  <div class="stats">
    <div class="head"><span class="file" id="file">—</span><span class="pct" id="pct" hidden></span></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="row"><span class="muted" id="left"></span><span class="muted" id="right"></span></div>
    <div class="note" id="stage"></div>
    <div class="err" id="err" hidden></div>
    <div class="ams" id="ams" hidden></div>
  </div>
</div>
<script>
  var L = {
    idle: { fr: 'Prête', en: 'Ready' },
    running: { fr: 'Impression', en: 'Printing' },
    paused: { fr: 'En pause', en: 'Paused' },
    finished: { fr: 'Terminé', en: 'Finished' },
    failed: { fr: 'Échec', en: 'Failed' },
    unknown: { fr: 'État inconnu', en: 'Unknown state' },
    cameraOff: { fr: 'Caméra indisponible', en: 'Camera unavailable' },
    minutes: { fr: '{n} min', en: '{n} min' },
    hoursMinutes: { fr: '{h} h {m}', en: '{h} h {m}' },
    nozzle: { fr: 'buse {value} °C', en: 'nozzle {value} °C' },
    bed: { fr: 'plateau {value} °C', en: 'bed {value} °C' },
    emptyTray: { fr: 'vide', en: 'empty' },
    amsUnit: { fr: 'AMS {n}', en: 'AMS {n}' },
    externalSpool: { fr: 'Ext.', en: 'Ext.' },
    amsClimate: { fr: '{h} % · {t} °C', en: '{h}% · {t} °C' },
    amsHumidity: { fr: '{h} %', en: '{h}%' },
    amsTemp: { fr: '{t} °C', en: '{t} °C' },
    trayRemain: { fr: '{n} % restants', en: '{n}% left' },
    cameraNeedsFfmpeg: {
      fr: 'L’aperçu caméra nécessite ffmpeg (brew install ffmpeg)',
      en: 'Camera preview needs ffmpeg (brew install ffmpeg)'
    },
    noConnection: { fr: 'Connexion manquante', en: 'No connection' },
    connecting: { fr: 'Connexion…', en: 'Connecting…' },
    percent: { fr: '{n} %', en: '{n}%' },
    layer: { fr: 'couche {n}', en: 'layer {n}' },
    layerOfTotal: { fr: 'couche {n} / {total}', en: 'layer {n} / {total}' },
    remaining: { fr: '{delay} restantes', en: '{delay} left' },
    unreachable: { fr: 'Imprimante injoignable', en: 'Printer unreachable' },
    error: { fr: 'Erreur {code}', en: 'Error {code}' }
  }
  var STATE_LABEL = { idle: L.idle, running: L.running, paused: L.paused, finished: L.finished, failed: L.failed, unknown: L.unknown }
  var showAms = false, channel = null, snapshot = null, unsub = null
  var showCamera = false, connection = null, camTimer = null, camLoaded = false

  /** Refreshed every 2 s, one still at a time; the server keeps the printer socket open while we ask. */
  var CAMERA_EVERY_MS = 2000

  function remaining(min) {
    if (min == null) return ''
    if (min < 60) return Fremkit.t(L.minutes, { n: min })
    return Fremkit.t(L.hoursMinutes, { h: Math.floor(min / 60), m: String(min % 60).padStart(2, '0') })
  }
  function temps(d) {
    var parts = []
    if (d.nozzleTemp != null) parts.push(Fremkit.t(L.nozzle, { value: Math.round(d.nozzleTemp) + (d.nozzleTarget ? '/' + Math.round(d.nozzleTarget) : '') }))
    if (d.bedTemp != null) parts.push(Fremkit.t(L.bed, { value: Math.round(d.bedTemp) + (d.bedTarget ? '/' + Math.round(d.bedTarget) : '') }))
    return parts.join(' · ')
  }
  /**
   * The printer reports AMS humidity two ways: a dryness level 1..5 on the older units, a real
   * percentage on the newer ones. Anything at or under 5 is a level, so it is shown as one.
   */
  function climate(u) {
    var parts = []
    if (u.humidity != null) parts.push(u.humidity <= 5 ? 'H' + u.humidity : Fremkit.t(L.amsHumidity, { h: Math.round(u.humidity) }))
    if (u.temp != null && u.temp > 0) parts.push(Fremkit.t(L.amsTemp, { t: Math.round(u.temp) }))
    return parts.join(' · ')
  }
  /** The grey an empty or unreadable tray is drawn in. One value, used once. */
  var EMPTY_TRAY = '#3a404a'

  function trayHtml(t) {
    var height = t.remain == null ? 100 : Math.max(4, t.remain)
    var title = t.type || Fremkit.t(L.emptyTray)
    if (t.remain != null) title += ' · ' + Fremkit.t(L.trayRemain, { n: Math.round(t.remain) })
    return '<span class="tray' + (t.active ? ' active' : '') + '" title="' + Fremkit.esc(title) + '">' +
      // A filament colour comes from the printer: only a #rrggbb reaches a style attribute,
      // or `red; background: url(…)` would be two declarations rather than one bad colour.
      '<i style="height:' + height + '%;background:' + Fremkit.color(t.color, EMPTY_TRAY) + '"></i>' +
      '<span>' + Fremkit.esc(t.type || '') + '</span></span>'
  }
  /** One row per AMS, in the order the printer lists them, then the external spool if loaded. */
  function renderAms(d) {
    var el = document.getElementById('ams')
    var ams = d && d.ams
    var units = ams && ams.units && ams.units.length
      ? ams.units
      // A snapshot from before the multi-unit change still has the flat list and nothing else.
      : (ams && ams.trays && ams.trays.length ? [{ id: 0, trays: ams.trays }] : [])
    if (!showAms || !units.length) { el.hidden = true; return }
    el.hidden = false
    var numbered = 0
    el.innerHTML = units.map(function (u) {
      // The external spool is not an AMS, so it does not take a number from the ones that are.
      var label = u.external ? Fremkit.t(L.externalSpool) : Fremkit.t(L.amsUnit, { n: ++numbered })
      var sub = climate(u)
      return '<div class="unit">' +
        '<span class="unitlabel"><b>' + Fremkit.esc(label) + '</b>' + Fremkit.esc(sub) + '</span>' +
        '<span class="slots' + (u.trays.length === 1 ? ' one' : '') + '">' + u.trays.map(trayHtml).join('') + '</span>' +
        '</div>'
    }).join('')
  }
  /**
   * The picture, or the placeholder.
   *
   * Two reasons to fall back: the request failed (no connection, no frame yet, printer asleep) or
   * the printer's own snapshot says no frame reached the server in the last ten seconds.
   */
  function renderCam() {
    var off = !camLoaded || (snapshot && snapshot.camera === false)
    document.getElementById('shot').classList.toggle('off', !!off)
    var note = document.getElementById('camoff')
    note.hidden = !off
    // A failure the user can fix gets its own wording; everything else is just "unavailable".
    var code = snapshot && snapshot.cameraError
    note.textContent = Fremkit.t(code === 'ffmpeg-missing' ? L.cameraNeedsFfmpeg : L.cameraOff)
  }
  function refreshCam() {
    // A tile on a page nobody is looking at costs the printer nothing.
    if (!showCamera || !connection || document.visibilityState !== 'visible') return
    document.getElementById('shot').src = '/api/bambu/' + encodeURIComponent(connection) + '/snapshot.jpg?t=' + Date.now()
  }
  function applyCamera() {
    var on = showCamera && !!connection
    document.getElementById('cam').hidden = !on
    if (camTimer) { clearInterval(camTimer); camTimer = null }
    if (!on) {
      // Drop the picture as well, so switching printers cannot show the previous chamber.
      camLoaded = false
      document.getElementById('shot').removeAttribute('src')
      renderCam()
      return
    }
    camTimer = setInterval(refreshCam, CAMERA_EVERY_MS)
    refreshCam()
  }

  /** Blanks everything a previous printer left on screen. */
  function reset() {
    document.getElementById('pct').hidden = true
    document.getElementById('bar').className = 'bar'
    document.getElementById('fill').style.width = '0%'
    document.getElementById('left').textContent = ''
    document.getElementById('right').textContent = ''
    document.getElementById('stage').textContent = ''
    document.getElementById('camoff').textContent = Fremkit.t(L.cameraOff)
    document.getElementById('err').hidden = true
    document.getElementById('ams').hidden = true
    document.getElementById('wrap').classList.remove('offline')
    renderCam()
  }
  function render() {
    var wrap = document.getElementById('wrap')
    if (!channel) { reset(); document.getElementById('file').textContent = Fremkit.t(L.noConnection); return }
    if (!snapshot) { reset(); document.getElementById('file').textContent = Fremkit.t(L.connecting); return }
    var d = snapshot
    wrap.classList.toggle('offline', !d.connected)
    document.getElementById('file').textContent = d.file || (STATE_LABEL[d.state] ? Fremkit.t(STATE_LABEL[d.state]) : '—')
    var pct = document.getElementById('pct')
    pct.hidden = d.percent == null
    if (d.percent != null) pct.textContent = Fremkit.t(L.percent, { n: Math.round(d.percent) })
    var bar = document.getElementById('bar')
    bar.className = 'bar ' + d.state
    document.getElementById('fill').style.width = (d.percent == null ? 0 : Math.max(0, Math.min(100, d.percent))) + '%'
    var left = []
    if (d.layer != null) left.push(d.totalLayers ? Fremkit.t(L.layerOfTotal, { n: d.layer, total: d.totalLayers }) : Fremkit.t(L.layer, { n: d.layer }))
    if (d.remainingMin != null && d.state === 'running') left.push(Fremkit.t(L.remaining, { delay: remaining(d.remainingMin) }))
    document.getElementById('left').textContent = left.join(' · ')
    document.getElementById('right').textContent = temps(d)
    document.getElementById('stage').textContent = d.connected
      ? (STATE_LABEL[d.state] ? Fremkit.t(STATE_LABEL[d.state]) : '') + (d.stage ? ' · ' + d.stage : '')
      : Fremkit.t(L.unreachable)
    var err = document.getElementById('err')
    err.hidden = !d.error
    if (d.error) err.textContent = Fremkit.t(L.error, { code: d.error })
    renderAms(d)
    renderCam()
  }

  /** Applies the settings, live. Only a change of printer touches the subscription. */
  function applySettings(s) {
    showAms = !!s.showAms
    var nextCamera = !!s.showCamera
    var nextConnection = s.connection || null
    var next = nextConnection ? 'bambu:' + nextConnection : null
    if (next !== channel) {
      if (unsub) { unsub(); unsub = null }
      // Another printer's job is not this one's, so nothing is kept from it.
      snapshot = null
      channel = next
      if (channel) unsub = Fremkit.subscribe(channel, function (d) { snapshot = d; render() })
    }
    if (nextCamera !== showCamera || nextConnection !== connection) {
      showCamera = nextCamera
      connection = nextConnection
      applyCamera()
    }
    render()
  }

  Fremkit.whenReady(function () {
    document.documentElement.lang = Fremkit.locale
    document.getElementById('camoff').textContent = Fremkit.t(L.cameraOff)
    Fremkit.onLocale(function (locale) {
      document.documentElement.lang = locale
      document.getElementById('camoff').textContent = Fremkit.t(L.cameraOff)
      render()
    })
    var shot = document.getElementById('shot')
    shot.addEventListener('load', function () { camLoaded = true; renderCam() })
    // 404 (unknown printer) or 503 (no frame yet): keep asking, show the placeholder meanwhile.
    shot.addEventListener('error', function () { camLoaded = false; renderCam() })
    // Coming back to the page must not wait out the interval before showing a live picture.
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshCam() })
    applySettings(Fremkit.settings)
    // Live preview and a printer picked after the widget was placed, without a reload.
    Fremkit.onSettings(function (next) { applySettings(next || {}) })
  })
</script></body></html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A fork's pull request gets a read-only token: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # The widget catalogue test reads the real widgets/ folder, so a broken
      # manifest fails here.
      - run: pnpm test

      - run: pnpm build
